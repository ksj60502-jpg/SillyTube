<script>

  let currentUser = null;
  let authMode = "login";


  /* =====================================================
     HELPERY
     ===================================================== */

  const $ = id =>
    document.getElementById(id);


  function openModal(id) {
    $(id).classList.add("open");
  }


  function closeModal(id) {
    $(id).classList.remove("open");
  }


  function msg(el, text, ok = false) {

    el.style.display = "block";

    el.textContent = text;

    el.style.color =
      ok
        ? "#5ee68a"
        : "#ff8a8a";
  }


  function esc(s) {

    return String(s ?? "")
      .replace(
        /[&<>"']/g,
        m => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[m])
      );

  }


  /* =====================================================
     AUTH
     ===================================================== */

  async function init() {

    const {
      data
    } = await sb.auth.getSession();

    currentUser =
      data.session?.user || null;

    sb.auth.onAuthStateChange(
      (_event, session) => {

        currentUser =
          session?.user || null;

        renderAccount();

        loadVideos();

      }
    );

    renderAccount();

    loadVideos();

  }


  function renderAccount() {

    const a =
      $("account");

    if (!currentUser) {

      a.innerHTML = `
        <button
          class="btn gray"
          id="loginBtn"
        >
          Zaloguj się
        </button>
      `;

      $("loginBtn").onclick =
        () => openAuth();

      return;
    }


    a.innerHTML = `
      <div class="userbox">

        <span
          id="bal"
          class="balance"
        >
          🪙 ...
        </span>

        <button
          class="btn gray"
          id="logout"
        >
          Wyloguj
        </button>

      </div>
    `;


    $("logout").onclick =
      async () => {

        await sb.auth.signOut();

      };


    loadBalance();

  }


  function openAuth() {

    openModal("authModal");

  }


  $("authAction").onclick =
    async () => {

      const email =
        $("authEmail")
          .value
          .trim();

      const password =
        $("authPass")
          .value;

      const st =
        $("authStatus");


      if (
        !email ||
        password.length < 6
      ) {

        return msg(
          st,
          "Podaj e-mail i hasło (minimum 6 znaków)."
        );

      }


      let r;


      if (authMode === "login") {

        r =
          await sb.auth.signInWithPassword({
            email,
            password
          });

      } else {

        r =
          await sb.auth.signUp({
            email,
            password
          });

      }


      if (r.error) {

        return msg(
          st,
          r.error.message
        );

      }


      if (authMode === "signup") {

        msg(
          st,
          "Konto utworzone. Sprawdź e-mail, aby potwierdzić konto.",
          true
        );

      } else {

        closeModal("authModal");

      }

    };


  $("switchAuth").onclick =
    () => {

      authMode =
        authMode === "login"
          ? "signup"
          : "login";


      $("authTitle").textContent =
        authMode === "login"
          ? "Zaloguj się"
          : "Załóż konto";


      $("authAction").textContent =
        authMode === "login"
          ? "Zaloguj"
          : "Zarejestruj";


      $("authSwitch").firstChild.textContent =
        authMode === "login"
          ? "Nie masz konta? "
          : "Masz już konto? ";

    };


  /* =====================================================
     PROFILE / BALANCE
     ===================================================== */

  async function loadBalance() {

    if (!currentUser)
      return;


    const {
      data
    } = await sb
      .from("profiles")
      .select("psc_balance,username")
      .eq("id", currentUser.id)
      .maybeSingle();


    if (
      data &&
      $("bal")
    ) {

      $("bal").textContent =
        "🪙 " +
        Number(
          data.psc_balance || 0
        ).toFixed(2) +
        " zł";

    }

  }


  /* =====================================================
     CHANNEL
     ===================================================== */

  async function getOrCreateChannel() {

    if (!currentUser) {

      throw new Error(
        "Musisz być zalogowany."
      );

    }


    /*
      Najpierw szukamy istniejącego kanału.
    */

    let result =
      await sb
        .from("channels")
        .select("id,name,owner_id")
        .eq(
          "owner_id",
          currentUser.id
        )
        .limit(1)
        .maybeSingle();


    if (result.error) {

      throw new Error(
        result.error.message
      );

    }


    if (result.data) {

      return result.data;

    }


    /*
      Jeśli kanału nie ma,
      próbujemy utworzyć.
    */

    let username =
      currentUser
        .user_metadata
        ?.username;


    if (!username) {

      username =
        currentUser.email
          ?.split("@")[0];

    }


    username =
      username || "Użytkownik";


    result =
      await sb
        .from("channels")
        .insert({
          owner_id: currentUser.id,
          name:
            username +
            " - kanał",
          description:
            "Mój kanał na SillyTube"
        })
        .select("id,name,owner_id")
        .single();


    if (result.error) {

      throw new Error(
        "Nie udało się znaleźć ani utworzyć kanału: " +
        result.error.message
      );

    }


    return result.data;

  }


  /* =====================================================
     UPLOAD
     ===================================================== */

  $("uploadBtn").onclick =
    async () => {

      if (!currentUser) {

        openAuth();

        return;

      }


      openModal(
        "uploadModal"
      );

    };


  $("videoFile").addEventListener(
    "change",
    () => {

      const file =
        $("videoFile").files[0];

      if (!file) {

        $("videoFileInfo")
          .textContent = "";

        return;

      }


      $("videoFileInfo")
        .textContent =
        "Wybrano: " +
        file.name +
        " (" +
        (
          file.size /
          1024 /
          1024
        ).toFixed(1) +
        " MB)";

    }
  );


  $("publish").onclick =
    async () => {

      const title =
        $("videoTitle")
          .value
          .trim();

      const description =
        $("videoDescription")
          .value
          .trim();

      const vf =
        $("videoFile")
          .files[0];

      const tf =
        $("thumbFile")
          .files[0];

      const st =
        $("uploadStatus");


      if (!currentUser) {

        return msg(
          st,
          "Musisz być zalogowany."
        );

      }


      if (!title) {

        return msg(
          st,
          "Podaj tytuł filmu."
        );

      }


      if (!vf) {

        return msg(
          st,
          "Wybierz film."
        );

      }


      /*
        Limit 500 MB.
      */

      if (
        vf.size >
        500 * 1024 * 1024
      ) {

        return msg(
          st,
          "Film jest większy niż 500 MB."
        );

      }


      const publishBtn =
        $("publish");

      publishBtn.disabled = true;


      let base = null;
      let thumbPath = null;


      try {

        msg(
          st,
          "Sprawdzanie kanału..."
        );


        /*
          KLUCZOWY FIX:
          kanał jest pobierany automatycznie
          dla aktualnie zalogowanego użytkownika.
        */

        const channel =
          await getOrCreateChannel();


        msg(
          st,
          "Wysyłanie filmu..."
        );


        const safe =
          (
            vf.name ||
            "video"
          )
            .replace(
              /[^a-zA-Z0-9._-]/g,
              "_"
            );


        base =
          currentUser.id +
          "/" +
          Date.now() +
          "-" +
          safe;


        let r =
          await sb
            .storage
            .from("videos")
            .upload(
              base,
              vf,
              {
                upsert: false,
                contentType:
                  vf.type ||
                  "video/mp4"
              }
            );


        if (r.error) {

          throw new Error(
            "Błąd uploadu filmu: " +
            r.error.message
          );

        }


        /*
          Miniaturka
        */

        if (tf) {

          const ts =
            (
              tf.name ||
              "thumb"
            )
              .replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
              );


          thumbPath =
            currentUser.id +
            "/" +
            Date.now() +
            "-" +
            ts;


          r =
            await sb
              .storage
              .from("thumbnails")
              .upload(
                thumbPath,
                tf,
                {
                  upsert: false,
                  contentType:
                    tf.type
                }
              );


          if (r.error) {

            await sb
              .storage
              .from("videos")
              .remove([base]);


            throw new Error(
              "Błąd uploadu miniaturki: " +
              r.error.message
            );

          }

        }


        /*
          Zapis filmu w bazie.
        */

        r =
          await sb
            .from("videos")
            .insert({
              owner_id:
                currentUser.id,

              channel_id:
                channel.id,

              title:
                title,

              description:
                description,

              video_path:
                base,

              thumbnail_path:
                thumbPath
            });


        if (r.error) {

          await sb
            .storage
            .from("videos")
            .remove([base]);


          if (thumbPath) {

            await sb
              .storage
              .from("thumbnails")
              .remove([thumbPath]);

          }


          throw new Error(
            "Film został wysłany do Storage, ale nie udało się zapisać go w bazie: " +
            r.error.message
          );

        }


        msg(
          st,
          "Film opublikowany! 🎉",
          true
        );


        setTimeout(
          () => {

            closeModal(
              "uploadModal"
            );

            $("videoTitle")
              .value = "";

            $("videoDescription")
              .value = "";

            $("videoFile")
              .value = "";

            $("thumbFile")
              .value = "";

            $("videoFileInfo")
              .textContent = "";

            st.style.display =
              "none";

            loadVideos();

          },
          800
        );


      } catch (error) {

        msg(
          st,
          error.message ||
          "Nieznany błąd."
        );

      } finally {

        publishBtn.disabled =
          false;

      }

    };


  /* =====================================================
     PROMO CODE
     ===================================================== */

  $("codeBtn").onclick =
    () => {

      if (!currentUser) {

        return openAuth();

      }

      openModal(
        "codeModal"
      );

    };


  $("redeem").onclick =
    async () => {

      const code =
        $("promoCode")
          .value
          .trim();

      const st =
        $("codeStatus");


      if (!code)
        return;


      const {
        data,
        error
      } =
        await sb.rpc(
          "redeem_promo",
          {
            p_code: code
          }
        );


      if (error) {

        return msg(
          st,
          error.message
        );

      }


      msg(
        st,
        "Dodano " +
        Number(data).toFixed(2) +
        " zł do wirtualnego salda.",
        true
      );


      $("promoCode")
        .value = "";


      loadBalance();

    };


  /* =====================================================
     VIDEOS
     ===================================================== */

  async function loadVideos() {

    const q =
      $("search")
        .value
        .trim();


    let query =
      sb
        .from("videos")
        .select(`
          id,
          title,
          description,
          video_path,
          thumbnail_path,
          created_at,
          channel_id,
          owner_id,
          channels(
            id,
            name,
            owner_id
          )
        `)
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (q) {

      query =
        query.ilike(
          "title",
          "%" +
          q +
          "%"
        );

    }


    const {
      data,
      error
    } =
      await query;


    const el =
      $("list");


    console.log(
      "VIDEOS:",
      data
    );

    console.log(
      "VIDEO ERROR:",
      error
    );


    if (error) {

      el.innerHTML = `
        <div class="empty">
          <div class="big">⚠️</div>
          <h2>Błąd ładowania filmów</h2>
          <p class="muted">
            ${esc(error.message)}
          </p>
        </div>
      `;

      return;

    }


    if (
      !data ||
      data.length === 0
    ) {

      el.innerHTML = `
        <div class="empty">
          <div class="big">🎬</div>

          <h2>
            Nie ma jeszcze żadnych filmów
          </h2>

          <p class="muted">
            Zaloguj się i wrzuć pierwszy film.
          </p>
        </div>
      `;

      return;

    }


    el.innerHTML = `
      <div class="grid">

        ${data.map(v => {

          const video =
            sb
              .storage
              .from("videos")
              .getPublicUrl(
                v.video_path
              )
              .data
              .publicUrl;


          const thumb =
            v.thumbnail_path
              ? sb
                  .storage
                  .from("thumbnails")
                  .getPublicUrl(
                    v.thumbnail_path
                  )
                  .data
                  .publicUrl
              : "";


          const ch =
            v.channels;


          return `
            <article class="card">

              <video
                class="thumb"
                src="${esc(video)}"
                ${thumb
                  ? `poster="${esc(thumb)}"`
                  : ""}
                controls
                preload="metadata"
              ></video>

              <div class="info">

                <div class="title">
                  ${esc(v.title)}
                </div>

                ${
                  v.description
                    ? `
                      <div class="description">
                        ${esc(
                          v.description
                        )}
                      </div>
                    `
                    : ""
                }

                <div class="meta">

                  ${esc(
                    ch?.name ||
                    "Kanał"
                  )}

                  ·

                  ${new Date(
                    v.created_at
                  ).toLocaleDateString(
                    "pl-PL"
                  )}

                </div>

                <div class="actions">

                  <button
                    class="small-btn"
                    onclick="likeVideo('${v.id}')"
                  >
                    👍 Lubię to
                  </button>

                  <button
                    class="small-btn"
                    onclick="subscribe('${ch?.id || ""}')"
                  >
                    🔔 Subskrybuj
                  </button>

                </div>

              </div>

            </article>
          `;

        }).join("")}

      </div>
    `;

  }


  /* =====================================================
     SEARCH
     ===================================================== */

  let searchTimer = null;


  $("search").addEventListener(
    "input",
    () => {

      clearTimeout(
        searchTimer
      );


      searchTimer =
        setTimeout(
          loadVideos,
          200
        );

    }
  );


  /* =====================================================
     LIKE
     ===================================================== */

  async function likeVideo(videoId) {

    /*
      Ta funkcja zakłada,
      że tabela video_likes posiada
      video_id oraz visitor_id.
    */

    let visitorId =
      localStorage.getItem(
        "sillytube_visitor_id"
      );


    if (!visitorId) {

      visitorId =
        crypto.randomUUID();

      localStorage.setItem(
        "sillytube_visitor_id",
        visitorId
      );

    }


    const {
      error
    } =
      await sb
        .from("video_likes")
        .insert({
          video_id:
            videoId,

          visitor_id:
            visitorId
        });


    if (error) {

      if (
        error.code === "23505"
      ) {

        alert(
          "Już polubiłeś ten film 👍"
        );

      } else {

        alert(
          "Błąd lajka: " +
          error.message
        );

      }

      return;

    }


    alert(
      "Polubiono film 👍"
    );


    loadVideos();

  }


  /* =====================================================
     SUBSKRYPCJA
     ===================================================== */

  async function subscribe(channelId) {

    if (!currentUser) {

      openAuth();

      return;

    }


    if (!channelId) {

      alert(
        "Nie znaleziono kanału."
      );

      return;

    }


    const {
      error
    } =
      await sb
        .from("subscriptions")
        .insert({
          subscriber_id:
            currentUser.id,

          channel_id:
            channelId
        });


    if (error) {

      if (
        error.code === "23505"
      ) {

        alert(
          "Już subskrybujesz ten kanał."
        );

      } else {

        alert(
          error.message
        );

      }

      return;

    }


    alert(
      "Subskrypcja dodana! 🔔"
    );

  }


  /* =====================================================
     START
     ===================================================== */

  init();

</script>
