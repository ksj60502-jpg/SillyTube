<body>

  <!-- LOGOWANIE -->

      </h2>

  <script>

    let currentUser = null;
    let authMode = "login";
    let channels = [];

    const $ = id => document.getElementById(id);


    function openModal(id) {
      $(id).classList.add("open");
    }


    function closeModal(id) {
      $(id).classList.remove("open");
    }


    function msg(el, text, ok = false) {

      el.style.display = "block";
      el.textContent = text;

      el.style.color = ok
        ? "#5ee68a"
        : "#ff8a8a";
    }


    /*
     * =========================
     * START / SESJA
     * =========================
     */

    async function init() {

      console.log("SillyTube: uruchamianie...");

      const {
        data,
        error
      } = await sb.auth.getSession();


      if (error) {

        console.error(
          "Błąd pobierania sesji:",
          error
        );

        currentUser = null;

      } else {

        currentUser =
          data?.session?.user || null;
      }


      console.log(
        "Aktualny użytkownik:",
        currentUser?.email || "brak"
      );


      renderAccount();
      loadVideos();


      sb.auth.onAuthStateChange(
        (event, session) => {

          console.log(
            "Auth event:",
            event,
            session?.user?.email || "brak"
          );


          currentUser =
            session?.user || null;


          renderAccount();
          loadVideos();

        }
      );

    }


    /*
     * =========================
     * KONTO
     * =========================
     */

    function renderAccount() {

      const a = $("account");


      if (!currentUser) {

        a.innerHTML = `
          <button
            class="btn gray"
            id="loginBtn"
          >
            Zaloguj się
          </button>
        `;


        $("loginBtn").onclick =
          () => openAuth();


        return;
      }


      a.innerHTML = `
        <div class="userbox">

          <span
            id="bal"
            class="balance"
          >
            🪙 ...
          </span>

          <button
            class="btn gray"
            id="logout"
          >
            Wyloguj
          </button>

        </div>
      `;


      $("logout").onclick =
        async () => {

          const {
            error
          } = await sb.auth.signOut();


          if (error) {

            console.error(
              "Błąd wylogowania:",
              error
            );

          }

        };


      loadBalance();

    }


    function openAuth() {
      openModal("authModal");
    }


    /*
     * =========================
     * LOGOWANIE / REJESTRACJA
     * =========================
     */

    $("authAction").onclick = async () => {

      const email =
        $("authEmail").value.trim();

      const password =
        $("authPass").value;

      const st =
        $("authStatus");


      if (
        !email ||
        password.length < 6
      ) {

        return msg(
          st,
          "Podaj e-mail i hasło (min. 6 znaków)."
        );

      }


      $("authAction").disabled = true;
      $("authAction").textContent =
        "Ładowanie...";


      let r;


      try {

        if (authMode === "login") {

          /*
           * LOGOWANIE
           */

          r =
            await sb.auth.signInWithPassword({
              email,
              password
            });

        } else {

          /*
           * REJESTRACJA
           */

          r =
            await sb.auth.signUp({

              email,
              password,

              options: {
                emailRedirectTo:
                  "https://sillytube.ksj60502.workers.dev"
              }

            });

        }

      } catch (error) {

        console.error(
          "Auth exception:",
          error
        );


        msg(
          st,
          error.message ||
            "Wystąpił błąd."
        );


        $("authAction").disabled =
          false;

        $("authAction").textContent =
          authMode === "login"
            ? "Zaloguj"
            : "Zarejestruj";


        return;
      }


      $("authAction").disabled =
        false;


      $("authAction").textContent =
        authMode === "login"
          ? "Zaloguj"
          : "Zarejestruj";


      if (r.error) {

        console.error(
          "Auth error:",
          r.error
        );


        return msg(
          st,
          r.error.message
        );

      }


      /*
       * REJESTRACJA
       */

      if (authMode === "signup") {

        if (r.data?.session) {

          currentUser =
            r.data.session.user;

          renderAccount();

          closeModal("authModal");

        } else {

          msg(
            st,
            "Konto utworzone. Sprawdź e-mail i kliknij link potwierdzający.",
            true
          );

        }

      }


      /*
       * LOGOWANIE
       */

      else {

        if (r.data?.session) {

          currentUser =
            r.data.session.user;


          console.log(
            "Zalogowano:",
            currentUser.email
          );


          renderAccount();

          closeModal("authModal");

        } else {

          msg(
            st,
            "Logowanie nie utworzyło sesji."
          );

        }

      }

    };


    /*
     * =========================
     * LOGIN / SIGNUP SWITCH
     * =========================
     */

    $("switchAuth").onclick = () => {

      authMode =
        authMode === "login"
          ? "signup"
          : "login";


      $("authTitle").textContent =
        authMode === "login"
          ? "Zaloguj się"
          : "Załóż konto";


      $("authAction").textContent =
        authMode === "login"
          ? "Zaloguj"
          : "Zarejestruj";


      $("authSwitch").firstChild.textContent =
        authMode === "login"
          ? "Nie masz konta? "
          : "Masz już konto? ";


      $("authPass").value = "";

      $("authStatus").style.display =
        "none";

    };


    /*
     * =========================
     * UPLOAD / KOD
     * =========================
     */

    $("uploadBtn").onclick = () => {

      if (!currentUser) {
        return openAuth();
      }

      openModal("uploadModal");

    };


    $("codeBtn").onclick = () => {

      if (!currentUser) {
        return openAuth();
      }

      openModal("codeModal");

    };


    /*
     * =========================
     * BALANCE
     * =========================
     */

    async function loadBalance() {

      if (!currentUser) {
        return;
      }


      const {
        data,
        error
      } = await sb
        .from("profiles")
        .select("psc_balance,username")
        .eq("id", currentUser.id)
        .single();


      if (error) {

        console.error(
          "Błąd profilu:",
          error
        );

        return;
      }


      if (
        data &&
        $("bal")
      ) {

        $("bal").textContent =
          "🪙 " +
          Number(data.psc_balance)
            .toFixed(2) +
          " zł";

      }

    }


    /*
     * =========================
     * PROMO CODE
     * =========================
     */

    $("redeem").onclick = async () => {

      const code =
        $("promoCode").value.trim();

      const st =
        $("codeStatus");


      if (!code) {
        return;
      }


      const {
        data,
        error
      } = await sb.rpc(
        "redeem_promo",
        {
          p_code: code
        }
      );


      if (error) {

        return msg(
          st,
          error.message
        );

      }


      msg(
        st,
        "Dodano " +
          Number(data).toFixed(2) +
          " zł do wirtualnego salda.",
        true
      );


      $("promoCode").value = "";

      loadBalance();

    };


    /*
     * =========================
     * UPLOAD FILMU
     * =========================
     */

    $("publish").onclick = async () => {

      const title =
        $("videoTitle").value.trim();

      const vf =
        $("videoFile").files[0];

      const tf =
        $("thumbFile").files[0];

      const st =
        $("uploadStatus");


      if (!title || !vf) {

        return msg(
          st,
          "Podaj tytuł i wybierz film."
        );

      }


      if (
        vf.size >
        500 * 1024 * 1024
      ) {

        return msg(
          st,
          "Film jest większy niż 500 MB."
        );

      }


      msg(
        st,
        "Wysyłanie filmu..."
      );


      const safe =
        (vf.name || "video")
          .replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );


      const base =
        currentUser.id +
        "/" +
        Date.now() +
        "-" +
        safe;


      let r =
        await sb.storage
          .from("videos")
          .upload(
            base,
            vf,
            {
              upsert: false,
              contentType: vf.type
            }
          );


      if (r.error) {

        return msg(
          st,
          r.error.message
        );

      }


      let thumbPath = null;


      if (tf) {

        const ts =
          (tf.name || "thumb")
            .replace(
              /[^a-zA-Z0-9._-]/g,
              "_"
            );


        thumbPath =
          currentUser.id +
          "/" +
          Date.now() +
          "-" +
          ts;


        r =
          await sb.storage
            .from("thumbnails")
            .upload(
              thumbPath,
              tf,
              {
                upsert: false,
                contentType: tf.type
              }
            );


        if (r.error) {

          await sb.storage
            .from("videos")
            .remove([base]);


          return msg(
            st,
            r.error.message
          );

        }

      }


      const channel =
        await sb
          .from("channels")
          .select("id")
          .eq(
            "owner_id",
            currentUser.id
          )
          .limit(1)
          .maybeSingle();


      if (
        channel.error ||
        !channel.data
      ) {

        await sb.storage
          .from("videos")
          .remove([base]);


        if (thumbPath) {

          await sb.storage
            .from("thumbnails")
            .remove([thumbPath]);

        }


        return msg(
          st,
          "Nie znaleziono kanału."
        );

      }


      r =
        await sb
          .from("videos")
          .insert({

            owner_id:
              currentUser.id,

            channel_id:
              channel.data.id,

            title,

            video_path:
              base,

            thumbnail_path:
              thumbPath

          });


      if (r.error) {

        await sb.storage
          .from("videos")
          .remove([base]);


        if (thumbPath) {

          await sb.storage
            .from("thumbnails")
            .remove([thumbPath]);

        }


        return msg(
          st,
          r.error.message
        );

      }


      msg(
        st,
        "Film opublikowany!",
        true
      );


      setTimeout(
        () => {

          closeModal("uploadModal");

          loadVideos();

        },
        700
      );

    };


    /*
     * =========================
     * FILMY
     * =========================
     */

    async function loadVideos() {

      const q =
        $("search").value.trim();


      let query =
        sb
          .from("videos")
          .select(
            "id,title,video_path,thumbnail_path,created_at,channel_id,channels(id,name,owner_id)"
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (q) {

        query =
          query.ilike(
            "title",
            "%" + q + "%"
          );

      }


      const {
        data,
        error
      } = await query;


      const el =
        $("list");


      if (error) {

        console.error(
          "Błąd filmów:",
          error
        );


        return el.innerHTML =
          '<div class="empty">Błąd: ' +
          esc(error.message) +
          "</div>";

      }


      if (!data?.length) {

        return el.innerHTML =
          '<div class="empty">' +
          '<div class="big">🎬</div>' +
          "<h2>Nie ma jeszcze żadnych filmów</h2>" +
          '<p class="muted">Zaloguj się i wrzuć pierwszy film.</p>' +
          "</div>";

      }


      el.innerHTML =
        '<div class="grid">' +

        data.map(v => {

          const video =
            sb.storage
              .from("videos")
              .getPublicUrl(
                v.video_path
              )
              .data.publicUrl;


          const thumb =
            v.thumbnail_path
              ? sb.storage
                  .from("thumbnails")
                  .getPublicUrl(
                    v.thumbnail_path
                  )
                  .data.publicUrl
              : "";


          const ch =
            v.channels;


          return `
            <article class="card">

              <video
                class="thumb"
                src="${video}"
                ${
                  thumb
                    ? 'poster="' +
                      thumb +
                      '"'
                    : ""
                }
                controls
                preload="metadata"
              ></video>

              <div class="info">

                <div class="title">
                  ${esc(v.title)}
                </div>

                <div class="meta">

                  ${esc(
                    ch?.name ||
                    "Kanał"
                  )}

                  ·

                  <button
                    class="btn gray"
                    style="padding:6px 9px"
                    onclick="subscribe('${ch?.id || ""}')"
                  >
                    🔔 Subskrybuj
                  </button>

                </div>

              </div>

            </article>
          `;

        }).join("") +

        "</div>";

    }


    /*
     * =========================
     * SUBSKRYPCJA
     * =========================
     */

    async function subscribe(channelId) {

      if (!currentUser) {
        return openAuth();
      }


      if (!channelId) {
        return;
      }


      const {
        error
      } = await sb
        .from("subscriptions")
        .insert({

          subscriber_id:
            currentUser.id,

          channel_id:
            channelId

        });


      if (error) {

        if (
          error.code === "23505"
        ) {

          alert(
            "Już subskrybujesz ten kanał."
          );

        } else {

          alert(
            error.message
          );

        }

        return;
      }


      alert(
        "Subskrypcja dodana! Twórca otrzyma +10 zł wirtualnego salda."
      );

    }


    /*
     * =========================
     * ESCAPE HTML
     * =========================
     */

    function esc(s) {

      return String(s).replace(
        /[&<>"']/g,
        m => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        }[m])
      );

    }


    /*
     * =========================
     * SEARCH
     * =========================
     */

    $("search").addEventListener(
      "input",
      loadVideos
    );


    /*
     * =========================
     * START
     * =========================
     */

    init();

  </script>

</body>
