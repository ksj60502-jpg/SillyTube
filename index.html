<script>

  let currentUser = null;
  let authMode = "login";

  const likeCache = new Set();
  const subscriptionCache = new Set();


  /* =================================================
     POMOCNICZE
     ================================================= */

  const $ = id =>
    document.getElementById(id);


  function openModal(id) {
    $(id).classList.add("open");
  }


  function closeModal(id) {
    $(id).classList.remove("open");
  }


  function msg(el, text, ok = false) {

    el.style.display = "block";
    el.textContent = text;
    el.style.color = ok
      ? "#5ee68a"
      : "#ff8a8a";

  }


  function esc(value) {

    return String(value ?? "")
      .replace(
        /[&<>"']/g,
        function(m) {

          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          }[m];

        }
      );

  }


  function getVisitorId() {

    let visitorId =
      localStorage.getItem(
        "sillytube_visitor_id"
      );

    if (!visitorId) {

      visitorId =
        crypto.randomUUID();

      localStorage.setItem(
        "sillytube_visitor_id",
        visitorId
      );

    }

    return visitorId;

  }


  /* =================================================
     START
     ================================================= */

  async function init() {

    const result =
      await sb.auth.getSession();

    currentUser =
      result.data?.session?.user ||
      null;

    sb.auth.onAuthStateChange(
      function(_event, session) {

        currentUser =
          session?.user ||
          null;

        likeCache.clear();
        subscriptionCache.clear();

        renderAccount();
        loadVideos();

      }
    );

    renderAccount();
    await loadVideos();

  }


  /* =================================================
     KONTO
     ================================================= */

  function renderAccount() {

    const account =
      $("account");

    if (!currentUser) {

      account.innerHTML = `
        <button
          class="btn gray"
          id="loginBtn"
        >
          Zaloguj się
        </button>
      `;

      $("loginBtn").onclick =
        openAuth;

      return;

    }


    const username =
      currentUser.user_metadata?.username ||
      currentUser.email?.split("@")[0] ||
      "Użytkownik";


    account.innerHTML = `
      <div class="userbox">

        <button
          class="btn gray"
          id="profileTopBtn"
        >
          👤 ${esc(username)}
        </button>

        <button
          class="btn gray"
          id="logout"
        >
          Wyloguj
        </button>

      </div>
    `;


    $("profileTopBtn").onclick =
      showMyProfile;


    $("logout").onclick =
      async function() {

        await sb.auth.signOut();

      };

  }


  function openAuth() {

    openModal("authModal");

  }


  /* =================================================
     AUTH
     ================================================= */

  $("authAction").onclick =
    async function() {

      const email =
        $("authEmail")
          .value
          .trim();

      const password =
        $("authPass")
          .value;

      const status =
        $("authStatus");


      if (
        !email ||
        password.length < 6
      ) {

        msg(
          status,
          "Podaj e-mail i hasło (minimum 6 znaków)."
        );

        return;

      }


      let result;


      try {

        if (authMode === "login") {

          result =
            await sb.auth.signInWithPassword({
              email,
              password
            });

        } else {

          result =
            await sb.auth.signUp({
              email,
              password,
              options: {
                data: {
                  username:
                    email.split("@")[0]
                }
              }
            });

        }


        if (result.error) {

          msg(
            status,
            result.error.message
          );

          return;

        }


        if (authMode === "signup") {

          if (result.data?.session) {

            msg(
              status,
              "Konto utworzone i zalogowane. 🎉",
              true
            );

            setTimeout(
              () => closeModal("authModal"),
              700
            );

          } else {

            msg(
              status,
              "Konto utworzone. Sprawdź e-mail, aby potwierdzić konto.",
              true
            );

          }

        } else {

          closeModal("authModal");

        }

      } catch (error) {

        msg(
          status,
          error.message ||
          "Wystąpił błąd logowania."
        );

      }

    };


  $("switchAuth").onclick =
    function() {

      authMode =
        authMode === "login"
          ? "signup"
          : "login";


      $("authTitle").textContent =
        authMode === "login"
          ? "Zaloguj się"
          : "Załóż konto";


      $("authAction").textContent =
        authMode === "login"
          ? "Zaloguj"
          : "Zarejestruj";


      $("authPass")
        .setAttribute(
          "autocomplete",
          authMode === "login"
            ? "current-password"
            : "new-password"
        );


      $("authSwitch")
        .firstChild
        .textContent =
          authMode === "login"
            ? "Nie masz konta? "
            : "Masz już konto? ";

    };


  /* =================================================
     KANAŁ
     ================================================= */

  async function getOrCreateChannel() {

    if (!currentUser) {

      throw new Error(
        "Musisz być zalogowany."
      );

    }


    let result =
      await sb
        .from("channels")
        .select(
          "id,name,owner_id"
        )
        .eq(
          "owner_id",
          currentUser.id
        )
        .limit(1)
        .maybeSingle();


    if (result.error) {

      throw new Error(
        "Błąd wyszukiwania kanału: " +
        result.error.message
      );

    }


    if (result.data) {

      return result.data;

    }


    /*
      Profil musi istnieć przed utworzeniem kanału,
      ponieważ channels.owner_id wskazuje na profiles.id.
    */

    const profile =
      await sb
        .from("profiles")
        .select("id,username")
        .eq("id", currentUser.id)
        .maybeSingle();


    if (profile.error) {

      throw new Error(
        "Nie można sprawdzić profilu: " +
        profile.error.message
      );

    }


    if (!profile.data) {

      throw new Error(
        "Twoje konto nie ma jeszcze profilu w tabeli profiles. " +
        "Utwórz profil dla tego użytkownika w Supabase."
      );

    }


    const username =
      profile.data.username ||
      currentUser.user_metadata?.username ||
      currentUser.email?.split("@")[0] ||
      "Użytkownik";


    result =
      await sb
        .from("channels")
        .insert({
          owner_id:
            currentUser.id,

          name:
            username +
            " - kanał"
        })
        .select(
          "id,name,owner_id"
        )
        .single();


    if (result.error) {

      throw new Error(
        "Nie udało się utworzyć kanału: " +
        result.error.message
      );

    }


    return result.data;

  }


  /* =================================================
     UPLOAD
     ================================================= */

  $("uploadBtn").onclick =
    function() {

      if (!currentUser) {

        openAuth();
        return;

      }

      $("uploadStatus").style.display =
        "none";

      openModal("uploadModal");

    };


  $("videoFile").addEventListener(
    "change",
    function() {

      const file =
        $("videoFile").files[0];

      if (!file) {

        $("videoFileInfo")
          .textContent = "";

        return;

      }


      $("videoFileInfo")
        .textContent =
          "Wybrano: " +
          file.name +
          " (" +
          (
            file.size /
            1024 /
            1024
          ).toFixed(1) +
          " MB)";

    }
  );


  $("publish").onclick =
    async function() {

      const title =
        $("videoTitle")
          .value
          .trim();

      const description =
        $("videoDescription")
          .value
          .trim();

      const videoFile =
        $("videoFile")
          .files[0];

      const thumbFile =
        $("thumbFile")
          .files[0];

      const status =
        $("uploadStatus");

      const publish =
        $("publish");


      if (!currentUser) {

        msg(
          status,
          "Musisz być zalogowany."
        );

        return;

      }


      if (!title) {

        msg(
          status,
          "Podaj tytuł filmu."
        );

        return;

      }


      if (!videoFile) {

        msg(
          status,
          "Wybierz film."
        );

        return;

      }


      if (
        videoFile.size >
        500 * 1024 * 1024
      ) {

        msg(
          status,
          "Film jest większy niż 500 MB."
        );

        return;

      }


      publish.disabled = true;


      let videoPath = null;
      let thumbnailPath = null;


      try {

        msg(
          status,
          "Sprawdzanie kanału..."
        );


        const channel =
          await getOrCreateChannel();


        msg(
          status,
          "Wysyłanie filmu..."
        );


        const safeName =
          (
            videoFile.name ||
            "video"
          )
            .replace(
              /[^a-zA-Z0-9._-]/g,
              "_"
            );


        videoPath =
          currentUser.id +
          "/" +
          Date.now() +
          "-" +
          safeName;


        let result =
          await sb
            .storage
            .from("videos")
            .upload(
              videoPath,
              videoFile,
              {
                upsert: false,
                contentType:
                  videoFile.type ||
                  "video/mp4"
              }
            );


        if (result.error) {

          throw new Error(
            "Błąd uploadu filmu: " +
            result.error.message
          );

        }


        /* MINIATURKA */

        if (thumbFile) {

          const safeThumb =
            (
              thumbFile.name ||
              "thumbnail"
            )
              .replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
              );


          thumbnailPath =
            currentUser.id +
            "/" +
            Date.now() +
            "-" +
            safeThumb;


          result =
            await sb
              .storage
              .from("thumbnails")
              .upload(
                thumbnailPath,
                thumbFile,
                {
                  upsert: false,
                  contentType:
                    thumbFile.type ||
                    "image/jpeg"
                }
              );


          if (result.error) {

            await sb
              .storage
              .from("videos")
              .remove([
                videoPath
              ]);

            throw new Error(
              "Błąd miniaturki: " +
              result.error.message
            );

          }

        }


        /* BAZA */

        result =
          await sb
            .from("videos")
            .insert({
              owner_id:
                currentUser.id,

              channel_id:
                channel.id,

              title:
                title,

              description:
                description,

              video_path:
                videoPath,

              thumbnail_path:
                thumbnailPath
            });


        if (result.error) {

          await sb
            .storage
            .from("videos")
            .remove([
              videoPath
            ]);


          if (thumbnailPath) {

            await sb
              .storage
              .from("thumbnails")
              .remove([
                thumbnailPath
              ]);

          }


          throw new Error(
            "Nie udało się zapisać filmu: " +
            result.error.message
          );

        }


        msg(
          status,
          "Film opublikowany! 🎉",
          true
        );


        setTimeout(
          function() {

            closeModal(
              "uploadModal"
            );

            $("videoTitle").value = "";
            $("videoDescription").value = "";
            $("videoFile").value = "";
            $("thumbFile").value = "";
            $("videoFileInfo").textContent = "";

            status.style.display = "none";

            loadVideos();

          },
          800
        );


      } catch (error) {

        msg(
          status,
          error.message ||
          "Nieznany błąd."
        );

      } finally {

        publish.disabled = false;

      }

    };


  /* =================================================
     POBIERANIE FILMÓW
     ================================================= */

  async function loadVideos() {

    const search =
      $("search")
        .value
        .trim();


    const list =
      $("list");


    list.innerHTML =
      `<div class="loading">Ładowanie filmów...</div>`;


    let query =
      sb
        .from("videos")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (search) {

      query =
        query.ilike(
          "title",
          "%" +
          search +
          "%"
        );

    }


    const result =
      await query;


    console.log(
      "VIDEOS:",
      result.data
    );


    console.log(
      "VIDEO ERROR:",
      result.error
    );


    if (result.error) {

      list.innerHTML = `
        <div class="empty">

          <div class="big">⚠️</div>

          <h2>Błąd ładowania filmów</h2>

          <p class="muted">
            ${esc(result.error.message)}
          </p>

        </div>
      `;

      return;

    }


    const videos =
      result.data || [];


    if (!videos.length) {

      list.innerHTML = `
        <div class="empty">

          <div class="big">🎬</div>

          <h2>
            Nie ma jeszcze żadnych filmów
          </h2>

          <p class="muted">
            ${
              search
                ? "Nie znaleziono filmów dla tego wyszukiwania."
                : "Opublikuj pierwszy film!"
            }
          </p>

        </div>
      `;

      return;

    }


    /*
      Kanały pobieramy osobno,
      żeby brak relacji channels
      nie ukrywał filmów.
    */

    const channelIds =
      [
        ...new Set(
          videos
            .map(v => v.channel_id)
            .filter(Boolean)
        )
      ];


    let channels = [];


    if (channelIds.length) {

      const channelResult =
        await sb
          .from("channels")
          .select(
            "id,name,owner_id"
          )
          .in(
            "id",
            channelIds
          );


      if (!channelResult.error) {

        channels =
          channelResult.data || [];

      }

    }


    const channelMap = {};


    channels.forEach(
      channel => {

        channelMap[channel.id] =
          channel;

      }
    );


    /*
      Pobierz liczbę lajków.
    */

    const videoIds =
      videos.map(v => v.id);


    const likeCounts = {};


    if (videoIds.length) {

      const likesResult =
        await sb
          .from("video_likes")
          .select("video_id")
          .in(
            "video_id",
            videoIds
          );


      if (!likesResult.error) {

        (likesResult.data || [])
          .forEach(
            like => {

              likeCounts[like.video_id] =
                (likeCounts[like.video_id] || 0) + 1;

            }
          );

      }

    }


    /*
      Sprawdź lajki aktualnego visitorId.
    */

    const visitorId =
      getVisitorId();


    const myLikesResult =
      await sb
        .from("video_likes")
        .select("video_id")
        .eq(
          "visitor_id",
          visitorId
        )
        .in(
          "video_id",
          videoIds
        );


    likeCache.clear();


    if (!myLikesResult.error) {

      (myLikesResult.data || [])
        .forEach(
          row =>
            likeCache.add(
              row.video_id
            )
        );

    }


    /*
      Sprawdź subskrypcje zalogowanego.
    */

    subscriptionCache.clear();


    if (currentUser && channelIds.length) {

      const subsResult =
        await sb
          .from("subscriptions")
          .select("channel_id")
          .eq(
            "subscriber_id",
            currentUser.id
          )
          .in(
            "channel_id",
            channelIds
          );


      if (!subsResult.error) {

        (subsResult.data || [])
          .forEach(
            row =>
              subscriptionCache.add(
                row.channel_id
              )
          );

      }

    }


    list.innerHTML = `
      <div class="grid">

        ${videos.map(
          video => {

            const videoUrl =
              sb
                .storage
                .from("videos")
                .getPublicUrl(
                  video.video_path
                )
                .data
                .publicUrl;


            let thumbnailUrl = "";


            if (video.thumbnail_path) {

              thumbnailUrl =
                sb
                  .storage
                  .from("thumbnails")
                  .getPublicUrl(
                    video.thumbnail_path
                  )
                  .data
                  .publicUrl;

            }


            const channel =
              channelMap[
                video.channel_id
              ];


            const channelName =
              channel?.name ||
              "SillyTube";


            const likes =
              likeCounts[video.id] ||
              0;


            const liked =
              likeCache.has(
                video.id
              );


            const subscribed =
              subscriptionCache.has(
                video.channel_id
              );


            return `
              <article class="card">

                <video
                  class="thumb"
                  src="${esc(videoUrl)}"
                  ${
                    thumbnailUrl
                      ? `poster="${esc(thumbnailUrl)}"`
                      : ""
                  }
                  controls
                  preload="metadata"
                ></video>


                <div class="info">

                  <div class="title">
                    ${esc(video.title)}
                  </div>


                  ${
                    video.description
                      ? `
                        <div class="description">
                          ${esc(video.description)}
                        </div>
                      `
                      : ""
                  }


                  <div class="meta">

                    ${esc(channelName)}

                    ·

                    ${
                      video.created_at
                        ? new Date(
                            video.created_at
                          ).toLocaleDateString(
                            "pl-PL"
                          )
                        : ""
                    }

                  </div>


                  <div class="actions">

                    <button
                      class="small-btn ${
                        liked
                          ? "liked"
                          : ""
                      }"
                      onclick="likeVideo('${esc(video.id)}')"
                    >
                      👍 ${likes}
                    </button>


                    ${
                      channel?.id
                        ? `
                          <button
                            class="small-btn ${
                              subscribed
                                ? "subscribed"
                                : ""
                            }"
                            onclick="subscribe('${esc(channel.id)}')"
                          >
                            ${
                              subscribed
                                ? "🔔 Subskrybujesz"
                                : "🔔 Subskrybuj"
                            }
                          </button>

                          <button
                            class="small-btn"
                            onclick="showChannelProfile('${esc(channel.id)}')"
                          >
                            👤 Kanał
                          </button>
                        `
                        : ""
                    }

                  </div>

                </div>

              </article>
            `;

          }
        ).join("")}

      </div>
    `;

  }


  /* =================================================
     LIKE
     ================================================= */

  async function likeVideo(videoId) {

    const visitorId =
      getVisitorId();


    /*
      Jeżeli już polubiono,
      niczego nie dodajemy drugi raz.
    */

    if (
      likeCache.has(videoId)
    ) {

      alert(
        "Już polubiłeś ten film 👍"
      );

      return;

    }


    const result =
      await sb
        .from("video_likes")
        .insert({
          video_id:
            videoId,

          visitor_id:
            visitorId
        });


    if (result.error) {

      if (
        result.error.code ===
        "23505"
      ) {

        likeCache.add(
          videoId
        );

        alert(
          "Już polubiłeś ten film 👍"
        );

        return;

      }


      alert(
        "Błąd lajka: " +
        result.error.message
      );

      return;

    }


    likeCache.add(
      videoId
    );


    /*
      Od razu odświeżamy liczbę.
    */

    await loadVideos();

  }


  /* =================================================
     SUBSKRYPCJA
     ================================================= */

  async function subscribe(channelId) {

    if (!currentUser) {

      openAuth();
      return;

    }


    if (!channelId) {

      alert(
        "Nie znaleziono kanału."
      );

      return;

    }


    if (
      subscriptionCache.has(
        channelId
      )
    ) {

      alert(
        "Już subskrybujesz ten kanał 🔔"
      );

      return;

    }


    const result =
      await sb
        .from("subscriptions")
        .insert({
          subscriber_id:
            currentUser.id,

          channel_id:
            channelId
        });


    if (result.error) {

      if (
        result.error.code ===
        "23505"
      ) {

        subscriptionCache.add(
          channelId
        );

        alert(
          "Już subskrybujesz ten kanał."
        );

        return;

      }


      alert(
        "Błąd subskrypcji: " +
        result.error.message
      );

      return;

    }


    subscriptionCache.add(
      channelId
    );


    alert(
      "Subskrypcja dodana! 🔔"
    );


    await loadVideos();

  }


  /* =================================================
     PROFIL
     ================================================= */

  async function showMyProfile() {

    if (!currentUser) {

      openAuth();
      return;

    }


    try {

      /*
        Nie tworzymy kanału automatycznie przy
        samym otwieraniu profilu.

        Najpierw próbujemy znaleźć istniejący.
      */

      const channelResult =
        await sb
          .from("channels")
          .select(
            "id,name,owner_id"
          )
          .eq(
            "owner_id",
            currentUser.id
          )
          .limit(1)
          .maybeSingle();


      if (channelResult.error) {

        throw new Error(
          channelResult.error.message
        );

      }


      let channel =
        channelResult.data;


      /*
        Jeżeli kanału jeszcze nie ma,
        utworzymy go dopiero tutaj.
      */

      if (!channel) {

        channel =
          await getOrCreateChannel();

      }


      await showChannelProfile(
        channel.id
      );

    } catch (error) {

      alert(
        "Nie udało się otworzyć profilu: " +
        error.message
      );

    }

  }


  async function showChannelProfile(
    channelId
  ) {

    const content =
      $("profileContent");


    content.innerHTML =
      `<div class="loading">Ładowanie profilu...</div>`;


    openModal(
      "profileModal"
    );


    try {

      /*
        Kanał
      */

      const channelResult =
        await sb
          .from("channels")
          .select(
            "id,name,owner_id"
          )
          .eq(
            "id",
            channelId
          )
          .maybeSingle();


      if (channelResult.error) {

        throw new Error(
          channelResult.error.message
        );

      }


      const channel =
        channelResult.data;


      if (!channel) {

        throw new Error(
          "Nie znaleziono kanału."
        );

      }


      /*
        Filmy kanału
      */

      const videosResult =
        await sb
          .from("videos")
          .select("*")
          .eq(
            "channel_id",
            channelId
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (videosResult.error) {

        throw new Error(
          videosResult.error.message
        );

      }


      const videos =
        videosResult.data || [];


      /*
        Liczba subów
      */

      const subsResult =
        await sb
          .from("subscriptions")
          .select(
            "subscriber_id",
            {
              count: "exact",
              head: true
            }
          )
          .eq(
            "channel_id",
            channelId
          );


      const subscribers =
        subsResult.count || 0;


      /*
        Czy aktualny użytkownik subskrybuje
      */

      let isSubscribed = false;


      if (currentUser) {

        const mine =
          await sb
            .from("subscriptions")
            .select("channel_id")
            .eq(
              "subscriber_id",
              currentUser.id
            )
            .eq(
              "channel_id",
              channelId
            )
            .maybeSingle();


        isSubscribed =
          !!mine.data;

      }


      /*
        Avatar
      */

      const channelLetter =
        (channel.name || "S")
          .charAt(0)
          .toUpperCase();


      content.innerHTML = `

        <div class="profile">

          <div class="profile-top">

            <div class="avatar">
              ${esc(channelLetter)}
            </div>

            <div>

              <div class="profile-name">
                ${esc(channel.name)}
              </div>

              <div class="profile-stats">

                <div class="stat">
                  <strong>
                    ${subscribers}
                  </strong>
                  subskrybentów
                </div>

                <div class="stat">
                  <strong>
                    ${videos.length}
                  </strong>
                  filmów
                </div>

              </div>

            </div>

          </div>


          <div class="actions">

            ${
              currentUser &&
              channel.owner_id !== currentUser.id
                ? `
                  <button
                    class="btn ${
                      isSubscribed
                        ? "gray"
                        : "red"
                    }"
                    onclick="subscribeFromProfile('${esc(channel.id)}')"
                  >
                    ${
                      isSubscribed
                        ? "🔔 Subskrybujesz"
                        : "🔔 Subskrybuj"
                    }
                  </button>
                `
                : ""
            }

          </div>

        </div>


        <h2 class="section-title">
          🎬 Filmy kanału
        </h2>


        ${
          videos.length
            ? `
              <div class="grid">

                ${videos.map(
                  video => {

                    const videoUrl =
                      sb
                        .storage
                        .from("videos")
                        .getPublicUrl(
                          video.video_path
                        )
                        .data
                        .publicUrl;


                    const thumbUrl =
                      video.thumbnail_path
                        ? sb
                            .storage
                            .from("thumbnails")
                            .getPublicUrl(
                              video.thumbnail_path
                            )
                            .data
                            .publicUrl
                        : "";


                    return `
                      <article class="card">

                        <video
                          class="thumb"
                          src="${esc(videoUrl)}"
                          ${
                            thumbUrl
                              ? `poster="${esc(thumbUrl)}"`
                              : ""
                          }
                          controls
                          preload="metadata"
                        ></video>

                        <div class="info">

                          <div class="title">
                            ${esc(video.title)}
                          </div>

                          ${
                            video.description
                              ? `
                                <div class="description">
                                  ${esc(video.description)}
                                </div>
                              `
                              : ""
                          }

                        </div>

                      </article>
                    `;

                  }
                ).join("")}

              </div>
            `
            : `
              <div class="empty">

                <div class="big">
                  🎬
                </div>

                <h2>
                  Ten kanał nie ma jeszcze filmów.
                </h2>

              </div>
            `
        }

      `;

    } catch (error) {

      content.innerHTML = `
        <div class="empty">

          <div class="big">
            ⚠️
          </div>

          <h2>
            Błąd profilu
          </h2>

          <p class="muted">
            ${esc(error.message)}
          </p>

        </div>
      `;

    }

  }


  async function subscribeFromProfile(
    channelId
  ) {

    await subscribe(
      channelId
    );

    await showChannelProfile(
      channelId
    );

  }


  /* =================================================
     PRZYCISKI
     ================================================= */

  $("myProfileBtn").onclick =
    showMyProfile;


  $("homeLogo").onclick =
    function() {

      $("homeHero").style.display =
        "";

      loadVideos();

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    };


  let searchTimer;


  $("search").addEventListener(
    "input",
    function() {

      clearTimeout(
        searchTimer
      );


      searchTimer =
        setTimeout(
          loadVideos,
          200
        );

    }
  );


  /* =================================================
     START
     ================================================= */

  init();

</script>

</body>
</html>
