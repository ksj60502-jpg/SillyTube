<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>SillyTube</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0f0f0f;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      height: 64px;
      background: #181818;
      border-bottom: 1px solid #292929;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 22px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 23px;
      font-weight: 800;
      white-space: nowrap;
    }

    .logo span {
      background: #f03;
      padding: 7px 10px;
      border-radius: 9px;
      margin-right: 7px;
    }

    .search {
      flex: 1;
      max-width: 620px;
      margin: auto;
    }

    .search input {
      width: 100%;
      background: #101010;
      color: white;
      border: 1px solid #444;
      border-radius: 24px;
      padding: 11px 16px;
      outline: none;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .red {
      background: #f03;
      color: white;
    }

    .gray {
      background: #303030;
      color: white;
    }

    .green {
      color: #5ee68a;
      font-weight: 800;
    }

    .main {
      max-width: 1250px;
      margin: auto;
      padding: 25px 20px;
    }

    .hero {
      background: linear-gradient(120deg, #25102a, #121c35);
      border: 1px solid #303030;
      border-radius: 18px;
      padding: 26px;
      margin-bottom: 25px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 34px;
    }

    .muted {
      color: #999;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .card {
      background: #181818;
      border-radius: 12px;
      overflow: hidden;
      min-width: 0;
    }

    .thumb {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #292929;
    }

    .info {
      padding: 13px;
    }

    .title {
      font-weight: 700;
      font-size: 16px;
      word-break: break-word;
    }

    .description {
      color: #bbb;
      margin-top: 8px;
      line-height: 1.4;
      word-break: break-word;
    }

    .meta {
      color: #999;
      font-size: 13px;
      margin-top: 8px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .small-btn {
      padding: 7px 10px;
      border-radius: 8px;
      border: 0;
      background: #303030;
      color: white;
      cursor: pointer;
      font-weight: 700;
    }

    .small-btn:hover,
    .btn:hover {
      filter: brightness(1.12);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #000c;
      z-index: 20;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal.open {
      display: flex;
    }

    .box {
      width: min(560px, 100%);
      background: #181818;
      border: 1px solid #444;
      border-radius: 18px;
      padding: 24px;
      max-height: 90vh;
      overflow: auto;
    }

    .box h2 {
      margin-top: 0;
    }

    .box input,
    .box textarea {
      width: 100%;
      padding: 11px;
      margin: 7px 0 14px;
      background: #101010;
      color: white;
      border: 1px solid #444;
      border-radius: 9px;
      font-family: Arial, sans-serif;
    }

    .box textarea {
      min-height: 120px;
      resize: vertical;
    }

    .row {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .status {
      padding: 12px;
      border-radius: 10px;
      background: #222;
      margin: 10px 0;
      display: none;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .empty {
      text-align: center;
      padding: 65px 20px;
      border: 1px dashed #444;
      border-radius: 18px;
      background: #141414;
    }

    .empty .big {
      font-size: 55px;
    }

    .userbox {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .profile-card {
      background: #181818;
      border: 1px solid #333;
      border-radius: 18px;
      padding: 24px;
      margin-bottom: 25px;
    }

    .profile-name {
      font-size: 28px;
      font-weight: 800;
    }

    .profile-stats {
      display: flex;
      gap: 25px;
      margin-top: 12px;
      color: #bbb;
    }

    .profile-stat b {
      color: white;
      font-size: 20px;
    }

    .file-info {
      color: #999;
      font-size: 13px;
      margin-bottom: 10px;
    }

    @media(max-width:700px) {
      header {
        padding: 0 10px;
        gap: 8px;
      }

      .logo {
        font-size: 17px;
      }

      .green {
        display: none;
      }

      .search {
        display: none;
      }

      .main {
        padding: 16px 12px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    <span>▶</span>SillyTube
  </div>

  <div class="green">
    100% FREE
  </div>

  <div class="search">
    <input
      id="search"
      placeholder="Szukaj filmów..."
      autocomplete="off"
    >
  </div>

  <div id="account">
    <button class="btn gray" id="loginBtn">
      Zaloguj się
    </button>
  </div>

</header>

<main class="main">

  <section class="hero">

    <h1>SillyTube 🎬</h1>

    <p>
      Darmowa platforma wideo.
    </p>

    <p class="muted">
      Oglądaj i publikuj własne filmy.
    </p>

    <button class="btn red" id="uploadBtn">
      ⬆ Upload filmu
    </button>

    <button class="btn gray" id="profileBtn">
      👤 Mój profil
    </button>

  </section>

  <div id="profileArea"></div>

  <div id="list">
    <div class="empty">
      <div class="big">⏳</div>
      <h2>Ładowanie filmów...</h2>
    </div>
  </div>

</main>


<!-- LOGIN -->

<div class="modal" id="authModal">

  <div class="box">

    <h2 id="authTitle">
      Zaloguj się
    </h2>

    <input
      id="authEmail"
      type="email"
      placeholder="E-mail"
    >

    <input
      id="authPass"
      type="password"
      placeholder="Hasło"
    >

    <div class="row">

      <button
        class="btn gray"
        id="authCancel"
      >
        Anuluj
      </button>

      <button
        class="btn red"
        id="authAction"
      >
        Zaloguj
      </button>

    </div>

    <p class="muted" id="authSwitchText">
      Nie masz konta?
      <button class="btn gray" id="switchAuth">
        Załóż konto
      </button>
    </p>

    <div class="status" id="authStatus"></div>

  </div>

</div>


<!-- UPLOAD -->

<div class="modal" id="uploadModal">

  <div class="box">

    <h2>Upload filmu</h2>

    <input
      id="videoTitle"
      placeholder="Tytuł filmu"
    >

    <textarea
      id="videoDescription"
      placeholder="Opis filmu..."
    ></textarea>

    <label class="muted">
      Film
    </label>

    <input
      id="videoFile"
      type="file"
      accept="video/*"
    >

    <div
      class="file-info"
      id="videoFileInfo"
    ></div>

    <label class="muted">
      Miniaturka
    </label>

    <input
      id="thumbFile"
      type="file"
      accept="image/jpeg,image/png,image/gif,image/webp"
    >

    <div class="status" id="uploadStatus"></div>

    <div class="row">

      <button
        class="btn gray"
        id="uploadCancel"
      >
        Anuluj
      </button>

      <button
        class="btn red"
        id="publish"
      >
        Opublikuj
      </button>

    </div>

  </div>

</div>


<!-- SUPABASE + APP -->

<script type="module">

  import {
    createClient
  } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


  /*
    ====================================================
    SUPABASE
    ====================================================
  */

  const SUPABASE_URL =
    "https://czyklqosqoqxgaxoejpz.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_xChRH3i5kMb0ErQALcXKHA_Gogcykzj";


  const sb =
    createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /*
    ====================================================
    START APLIKACJI
    ====================================================
  */

  let currentUser = null;
  let authMode = "login";
  let searchTimer = null;


  const $ = id =>
    document.getElementById(id);


  function openModal(id) {
    $(id).classList.add("open");
  }


  function closeModal(id) {
    $(id).classList.remove("open");
  }


  function msg(el, text, ok = false) {

    el.style.display = "block";
    el.textContent = text;
    el.style.color =
      ok ? "#5ee68a" : "#ff8a8a";
  }


  function esc(value) {

    return String(value ?? "")
      .replace(
        /[&<>"']/g,
        function(m) {
          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          }[m];
        }
      );
  }


  function videoUrl(path) {

    if (!path) return "";

    return sb.storage
      .from("videos")
      .getPublicUrl(path)
      .data.publicUrl;
  }


  function thumbnailUrl(path) {

    if (!path) return "";

    return sb.storage
      .from("thumbnails")
      .getPublicUrl(path)
      .data.publicUrl;
  }


  /*
    ====================================================
    AUTH
    ====================================================
  */

  async function init() {

    try {

      const sessionResult =
        await sb.auth.getSession();

      currentUser =
        sessionResult.data.session?.user ||
        null;

      renderAccount();
      await loadVideos();

      sb.auth.onAuthStateChange(
        (_event, session) => {

          currentUser =
            session?.user || null;

          setTimeout(
            async () => {

              renderAccount();
              await loadVideos();

            },
            0
          );

        }
      );

    } catch (error) {

      console.error(
        "INIT ERROR:",
        error
      );

      $("list").innerHTML = `
        <div class="empty">

          <div class="big">⚠️</div>

          <h2>Błąd uruchamiania</h2>

          <p class="muted">
            ${esc(error.message)}
          </p>

        </div>
      `;

    }

  }


  /*
    ====================================================
    ACCOUNT
    ====================================================
  */

  function renderAccount() {

    const account =
      $("account");

    if (!currentUser) {

      account.innerHTML = `
        <button
          class="btn gray"
          id="loginBtn2"
        >
          Zaloguj się
        </button>
      `;

      $("loginBtn2").onclick =
        () => openModal("authModal");

      return;
    }


    account.innerHTML = `
      <div class="userbox">

        <button
          class="btn gray"
          id="profileTop"
        >
          👤 Profil
        </button>

        <button
          class="btn gray"
          id="logout"
        >
          Wyloguj
        </button>

      </div>
    `;


    $("profileTop").onclick =
      showMyProfile;


    $("logout").onclick =
      async () => {

        await sb.auth.signOut();

        $("profileArea").innerHTML = "";

      };

  }


  $("authCancel").onclick =
    () => closeModal("authModal");


  $("authAction").onclick =
    async () => {

      const email =
        $("authEmail").value.trim();

      const password =
        $("authPass").value;

      const status =
        $("authStatus");


      if (
        !email ||
        password.length < 6
      ) {

        msg(
          status,
          "Podaj e-mail i hasło. Hasło musi mieć minimum 6 znaków."
        );

        return;
      }


      let result;


      if (authMode === "login") {

        result =
          await sb.auth.signInWithPassword({
            email,
            password
          });

      } else {

        result =
          await sb.auth.signUp({
            email,
            password
          });

      }


      if (result.error) {

        msg(
          status,
          result.error.message
        );

        return;
      }


      if (authMode === "signup") {

        msg(
          status,
          "Konto utworzone. Jeżeli masz włączone potwierdzanie e-maila, sprawdź skrzynkę.",
          true
        );

      } else {

        closeModal("authModal");

      }

    };


  $("switchAuth").onclick =
    () => {

      authMode =
        authMode === "login"
          ? "signup"
          : "login";


      $("authTitle").textContent =
        authMode === "login"
          ? "Zaloguj się"
          : "Załóż konto";


      $("authAction").textContent =
        authMode === "login"
          ? "Zaloguj"
          : "Zarejestruj";


      $("authSwitchText").firstChild.textContent =
        authMode === "login"
          ? "Nie masz konta? "
          : "Masz już konto? ";

    };


  /*
    ====================================================
    PROFILE
    ====================================================
  */

  async function showMyProfile() {

    if (!currentUser) {

      openModal("authModal");
      return;

    }


    const area =
      $("profileArea");


    area.innerHTML = `
      <div class="profile-card">
        <p class="muted">Ładowanie profilu...</p>
      </div>
    `;


    /*
      Pobieramy kanał użytkownika.

      NIE tworzymy go automatycznie.
      Dzięki temu nie będzie już błędu
      channels_owner_id_fkey.
    */

    const channelResult =
      await sb
        .from("channels")
        .select("id,name,description,owner_id")
        .eq(
          "owner_id",
          currentUser.id
        )
        .maybeSingle();


    if (channelResult.error) {

      area.innerHTML = `
        <div class="profile-card">
          <h2>Nie udało się wczytać kanału</h2>
          <p class="muted">
            ${esc(channelResult.error.message)}
          </p>
        </div>
      `;

      return;
    }


    const channel =
      channelResult.data;


    if (!channel) {

      area.innerHTML = `
        <div class="profile-card">

          <h2>Nie masz jeszcze kanału</h2>

          <p class="muted">
            Kanał zostanie utworzony przy publikacji filmu.
          </p>

        </div>
      `;

      return;
    }


    /*
      Liczba subów
    */

    const subResult =
      await sb
        .from("subscriptions")
        .select(
          "id",
          {
            count: "exact",
            head: true
          }
        )
        .eq(
          "channel_id",
          channel.id
        );


    const subscriberCount =
      subResult.count || 0;


    /*
      Liczba filmów
    */

    const videoResult =
      await sb
        .from("videos")
        .select(
          "id",
          {
            count: "exact",
            head: true
          }
        )
        .eq(
          "channel_id",
          channel.id
        );


    const videoCount =
      videoResult.count || 0;


    area.innerHTML = `
      <section class="profile-card">

        <div class="profile-name">
          ${esc(channel.name)}
        </div>

        ${
          channel.description
            ? `
              <p class="muted">
                ${esc(channel.description)}
              </p>
            `
            : ""
        }

        <div class="profile-stats">

          <div class="profile-stat">
            <b>${subscriberCount}</b>
            <br>
            subskrybentów
          </div>

          <div class="profile-stat">
            <b>${videoCount}</b>
            <br>
            filmów
          </div>

        </div>

      </section>
    `;

  }


  $("profileBtn").onclick =
    showMyProfile;


  /*
    ====================================================
    CHANNEL
    ====================================================
  */

  async function getOrCreateChannel() {

    if (!currentUser) {

      throw new Error(
        "Musisz być zalogowany."
      );

    }


    /*
      Najpierw szukamy istniejącego kanału.
    */

    let result =
      await sb
        .from("channels")
        .select(
          "id,name,owner_id"
        )
        .eq(
          "owner_id",
          currentUser.id
        )
        .maybeSingle();


    if (result.error) {

      throw new Error(
        "Błąd sprawdzania kanału: " +
        result.error.message
      );

    }


    if (result.data) {

      return result.data;

    }


    /*
      Sprawdzamy profil.

      owner_id w channels MUSI wskazywać
      na istniejący profiles.id.
    */

    const profileResult =
      await sb
        .from("profiles")
        .select("id,username")
        .eq(
          "id",
          currentUser.id
        )
        .maybeSingle();


    if (profileResult.error) {

      throw new Error(
        "Nie można sprawdzić profilu: " +
        profileResult.error.message
      );

    }


    /*
      Jeżeli profil nie istnieje,
      nie próbujemy tworzyć channels,
      bo skończy się to błędem FK.
    */

    if (!profileResult.data) {

      throw new Error(
        "Twoje konto nie ma jeszcze profilu w tabeli profiles. " +
        "Utwórz profil dla tego użytkownika w Supabase."
      );

    }


    let username =
      profileResult.data.username ||
      currentUser.user_metadata?.username ||
      currentUser.email?.split("@")[0] ||
      "Użytkownik";


    result =
      await sb
        .from("channels")
        .insert({

          owner_id:
            currentUser.id,

          name:
            username + " - kanał",

          description:
            "Kanał SillyTube"

        })
        .select(
          "id,name,owner_id"
        )
        .single();


    if (result.error) {

      throw new Error(
        "Nie udało się utworzyć kanału: " +
        result.error.message
      );

    }


    return result.data;

  }


  /*
    ====================================================
    UPLOAD OPEN
    ====================================================
  */

  $("uploadBtn").onclick =
    () => {

      if (!currentUser) {

        openModal("authModal");
        return;

      }

      openModal("uploadModal");

    };


  $("uploadCancel").onclick =
    () => closeModal("uploadModal");


  $("videoFile").addEventListener(
    "change",
    () => {

      const file =
        $("videoFile").files[0];


      if (!file) {

        $("videoFileInfo").textContent =
          "";

        return;
      }


      $("videoFileInfo").textContent =
        "Wybrano: " +
        file.name +
        " (" +
        (
          file.size /
          1024 /
          1024
        ).toFixed(1) +
        " MB)";

    }
  );


  /*
    ====================================================
    UPLOAD
    ====================================================
  */

  $("publish").onclick =
    async () => {

      const title =
        $("videoTitle")
          .value
          .trim();


      const description =
        $("videoDescription")
          .value
          .trim();


      const videoFile =
        $("videoFile")
          .files[0];


      const thumbFile =
        $("thumbFile")
          .files[0];


      const status =
        $("uploadStatus");


      if (!currentUser) {

        msg(
          status,
          "Musisz być zalogowany."
        );

        return;

      }


      if (!title) {

        msg(
          status,
          "Podaj tytuł filmu."
        );

        return;

      }


      if (!videoFile) {

        msg(
          status,
          "Wybierz film."
        );

        return;

      }


      if (
        videoFile.size >
        500 * 1024 * 1024
      ) {

        msg(
          status,
          "Film jest większy niż 500 MB."
        );

        return;

      }


      const publish =
        $("publish");


      publish.disabled = true;


      let videoPath = null;
      let thumbnailPath = null;


      try {

        msg(
          status,
          "Sprawdzanie kanału..."
        );


        const channel =
          await getOrCreateChannel();


        if (!channel?.id) {

          throw new Error(
            "Nie znaleziono kanału."
          );

        }


        msg(
          status,
          "Wysyłanie filmu..."
        );


        const safeName =
          (
            videoFile.name ||
            "video.mp4"
          )
            .replace(
              /[^a-zA-Z0-9._-]/g,
              "_"
            );


        videoPath =
          currentUser.id +
          "/" +
          Date.now() +
          "-" +
          safeName;


        let result =
          await sb
            .storage
            .from("videos")
            .upload(
              videoPath,
              videoFile,
              {
                upsert: false,
                contentType:
                  videoFile.type ||
                  "video/mp4"
              }
            );


        if (result.error) {

          throw new Error(
            "Błąd uploadu filmu: " +
            result.error.message
          );

        }


        /*
          THUMBNAIL
        */

        if (thumbFile) {

          const safeThumb =
            (
              thumbFile.name ||
              "thumbnail"
            )
              .replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
              );


          thumbnailPath =
            currentUser.id +
            "/" +
            Date.now() +
            "-" +
            safeThumb;


          result =
            await sb
              .storage
              .from("thumbnails")
              .upload(
                thumbnailPath,
                thumbFile,
                {
                  upsert: false,
                  contentType:
                    thumbFile.type ||
                    "image/jpeg"
                }
              );


          if (result.error) {

            await sb
              .storage
              .from("videos")
              .remove([
                videoPath
              ]);


            throw new Error(
              "Błąd miniaturki: " +
              result.error.message
            );

          }

        }


        msg(
          status,
          "Zapisywanie filmu..."
        );


        result =
          await sb
            .from("videos")
            .insert({

              owner_id:
                currentUser.id,

              channel_id:
                channel.id,

              title:
                title,

              description:
                description,

              video_path:
                videoPath,

              thumbnail_path:
                thumbnailPath

            });


        if (result.error) {

          await sb
            .storage
            .from("videos")
            .remove([
              videoPath
            ]);


          if (thumbnailPath) {

            await sb
              .storage
              .from("thumbnails")
              .remove([
                thumbnailPath
              ]);

          }


          throw new Error(
            "Nie udało się zapisać filmu: " +
            result.error.message
          );

        }


        msg(
          status,
          "Film opublikowany! 🎉",
          true
        );


        setTimeout(
          async () => {

            closeModal(
              "uploadModal"
            );


            $("videoTitle").value =
              "";

            $("videoDescription").value =
              "";

            $("videoFile").value =
              "";

            $("thumbFile").value =
              "";

            $("videoFileInfo").textContent =
              "";

            status.style.display =
              "none";


            await loadVideos();

          },
          700
        );


      } catch (error) {

        console.error(
          "UPLOAD ERROR:",
          error
        );


        msg(
          status,
          error.message ||
          "Nieznany błąd."
        );

      } finally {

        publish.disabled =
          false;

      }

    };


  /*
    ====================================================
    LOAD VIDEOS
    ====================================================
  */

  async function loadVideos() {

    const list =
      $("list");


    const search =
      $("search")
        .value
        .trim();


    let query =
      sb
        .from("videos")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (search) {

      query =
        query.ilike(
          "title",
          "%" +
          search +
          "%"
        );

    }


    const result =
      await query;


    console.log(
      "VIDEOS:",
      result.data
    );


    console.log(
      "VIDEO ERROR:",
      result.error
    );


    if (result.error) {

      list.innerHTML = `
        <div class="empty">

          <div class="big">
            ⚠️
          </div>

          <h2>
            Błąd ładowania filmów
          </h2>

          <p class="muted">
            ${esc(result.error.message)}
          </p>

        </div>
      `;

      return;

    }


    const videos =
      result.data || [];


    if (videos.length === 0) {

      list.innerHTML = `
        <div class="empty">

          <div class="big">
            🎬
          </div>

          <h2>
            ${
              search
                ? "Nie znaleziono filmów"
                : "Nie ma jeszcze żadnych filmów"
            }
          </h2>

          <p class="muted">
            ${
              search
                ? "Spróbuj innej frazy."
                : "Zaloguj się i wrzuć pierwszy film."
            }
          </p>

        </div>
      `;

      return;

    }


    /*
      Kanały pobieramy osobno.
      Jeśli kanału brakuje, film nadal się pokaże.
    */

    const channelIds =
      [
        ...new Set(
          videos
            .map(
              v => v.channel_id
            )
            .filter(Boolean)
        )
      ];


    let channels = [];


    if (channelIds.length) {

      const channelResult =
        await sb
          .from("channels")
          .select(
            "id,name"
          )
          .in(
            "id",
            channelIds
          );


      if (!channelResult.error) {

        channels =
          channelResult.data || [];

      } else {

        console.warn(
          "CHANNEL LOAD ERROR:",
          channelResult.error
        );

      }

    }


    const channelMap = {};


    channels.forEach(
      channel => {

        channelMap[
          channel.id
        ] =
          channel.name;

      }
    );


    /*
      Pobieramy lajki.

      Jeżeli RLS nie pozwoli na count,
      filmy nadal będą wyświetlone.
    */

    const videoIds =
      videos
        .map(v => v.id)
        .filter(Boolean);


    const likeMap = {};


    if (videoIds.length) {

      const likesResult =
        await sb
          .from("video_likes")
          .select("video_id")
          .in(
            "video_id",
            videoIds
          );


      if (
        !likesResult.error &&
        likesResult.data
      ) {

        likesResult.data.forEach(
          like => {

            likeMap[like.video_id] =
              (
                likeMap[like.video_id] ||
                0
              ) + 1;

          }
        );

      }

    }


    list.innerHTML = `
      <div class="grid">

        ${videos.map(
          video => {

            const vUrl =
              videoUrl(
                video.video_path
              );


            const tUrl =
              thumbnailUrl(
                video.thumbnail_path
              );


            const channelName =
              channelMap[
                video.channel_id
              ] ||
              "SillyTube";


            const likes =
              likeMap[video.id] ||
              0;


            return `
              <article class="card">

                <video
                  class="thumb"
                  src="${esc(vUrl)}"
                  ${
                    tUrl
                      ? `poster="${esc(tUrl)}"`
                      : ""
                  }
                  controls
                  preload="metadata"
                ></video>


                <div class="info">

                  <div class="title">
                    ${esc(video.title)}
                  </div>


                  ${
                    video.description
                      ? `
                        <div class="description">
                          ${esc(
                            video.description
                          )}
                        </div>
                      `
                      : ""
                  }


                  <div class="meta">

                    ${esc(channelName)}

                    ·

                    ${
                      video.created_at
                        ? new Date(
                            video.created_at
                          ).toLocaleDateString(
                            "pl-PL"
                          )
                        : ""
                    }

                  </div>


                  <div class="actions">

                    <button
                      class="small-btn like-btn"
                      data-video="${esc(video.id)}"
                    >
                      👍 ${likes}
                    </button>


                    ${
                      video.channel_id
                        ? `
                          <button
                            class="small-btn subscribe-btn"
                            data-channel="${esc(
                              video.channel_id
                            )}"
                          >
                            🔔 Subskrybuj
                          </button>
                        `
                        : ""
                    }

                  </div>

                </div>

              </article>
            `;

          }
        ).join("")}

      </div>
    `;


    /*
      Podpinamy eventy po renderze.
    */

    document
      .querySelectorAll(".like-btn")
      .forEach(
        button => {

          button.onclick =
            () =>
              likeVideo(
                button.dataset.video,
                button
              );

        }
      );


    document
      .querySelectorAll(".subscribe-btn")
      .forEach(
        button => {

          button.onclick =
            () =>
              subscribe(
                button.dataset.channel,
                button
              );

        }
      );

  }


  /*
    ====================================================
    SEARCH
    ====================================================
  */

  $("search").addEventListener(
    "input",
    () => {

      clearTimeout(
        searchTimer
      );


      searchTimer =
        setTimeout(
          loadVideos,
          250
        );

    }
  );


  /*
    ====================================================
    LIKE
    ====================================================
  */

  async function likeVideo(
    videoId,
    button
  ) {

    let visitorId =
      localStorage.getItem(
        "sillytube_visitor_id"
      );


    if (!visitorId) {

      visitorId =
        crypto.randomUUID();

      localStorage.setItem(
        "sillytube_visitor_id",
        visitorId
      );

    }


    button.disabled = true;


    const result =
      await sb
        .from("video_likes")
        .insert({

          video_id:
            videoId,

          visitor_id:
            visitorId

        });


    if (result.error) {

      button.disabled = false;


      if (
        result.error.code ===
        "23505"
      ) {

        alert(
          "Już polubiłeś ten film 👍"
        );

      } else {

        alert(
          "Błąd lajka: " +
          result.error.message
        );

      }

      return;

    }


    /*
      Zwiększamy licznik od razu
      bez konieczności wpisywania czegoś
      w wyszukiwarkę.
    */

    const oldText =
      button.textContent
        .replace("👍", "")
        .trim();


    const oldCount =
      parseInt(oldText, 10) || 0;


    button.textContent =
      "👍 " +
      (oldCount + 1);


    button.disabled = true;

  }


  /*
    ====================================================
    SUBSCRIBE
    ====================================================
  */

  async function subscribe(
    channelId,
    button
  ) {

    if (!currentUser) {

      openModal("authModal");
      return;

    }


    if (!channelId) {

      alert(
        "Nie znaleziono kanału."
      );

      return;

    }


    button.disabled = true;


    const result =
      await sb
        .from("subscriptions")
        .insert({

          subscriber_id:
            currentUser.id,

          channel_id:
            channelId

        });


    if (result.error) {

      button.disabled = false;


      if (
        result.error.code ===
        "23505"
      ) {

        alert(
          "Już subskrybujesz ten kanał."
        );

      } else {

        alert(
          "Błąd subskrypcji: " +
          result.error.message
        );

      }

      return;

    }


    button.textContent =
      "✓ Subskrybujesz";


    /*
      Jeżeli oglądasz własny profil,
      odświeżamy liczbę subów.
    */

    if (
      $("profileArea").innerHTML
    ) {

      try {
        await showMyProfile();
      } catch (_) {}

    }

  }


  /*
    ====================================================
    START
    ====================================================
  */

  init();

</script>
