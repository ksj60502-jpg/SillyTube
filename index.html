<script>

let currentUser=null;
let authMode="login";
let activeTab="home";
let activeVideoId=null;
let activeChannelId=null;

const MAX_VIDEO_SIZE = 10 * 1024 * 1024 * 1024;

const $ = id => document.getElementById(id);

const esc = v =>
  String(v ?? "").replace(
    /[&<>"']/g,
    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#039;"
    }[m])
  );

function openModal(id){
  $(id).classList.add("open");
}

function closeModal(id){
  $(id).classList.remove("open");
}

function msg(el,text,ok=false){
  el.style.display="block";
  el.textContent=text;
  el.style.color=ok ? "#5ee68a" : "#ff8a8a";
}

function requireAuth(){
  if(!currentUser){
    openAuth();
    return false;
  }

  return true;
}

function openAuth(){
  openModal("authModal");
}

function avatarLetter(){

}


/* INIT */

async function init(){

  const {data} = await sb.auth.getSession();

  currentUser =

}


/* ACCOUNT */

function renderAccount(){

    a.innerHTML =

    $("loginBtn").onclick=openAuth;

  a.innerHTML = `

      </button>

      <button
        class="btn gray"
        id="logout"
      >
        Wyloguj
      </button>

    </div>

  `;

  $("accountBtn").onclick=showMyProfile;

  $("logout").onclick=async()=>{
    await sb.auth.signOut();
  };

  loadBalance();
}


/* AUTH */

$("authAction").onclick = async()=>{

  const email =
    $("authEmail").value.trim();

  const password =
    $("authPass").value;

  const status =
    $("authStatus");

  if(
    !email ||
    password.length < 6
  ){
    return msg(
      status,
      "Podaj e-mail i hasło (minimum 6 znaków)."
    );
  }

  const redirectTo =
    location.origin + location.pathname;

  const result =
    authMode==="login"

      ? await sb.auth.signInWithPassword({
          email,
          password
        })

      : await sb.auth.signUp({
          email,
          password,
          options:{
            emailRedirectTo:redirectTo
          }
        });

  if(result.error){
    return msg(
      status,
      result.error.message
    );
  }

  if(
    authMode==="signup" &&
    !result.data.session
  ){

    msg(
      status,
      "Konto utworzone. Sprawdź e-mail i kliknij potwierdzenie.",
      true
    );

    return;
  }

  closeModal("authModal");
};


$("switchAuth").onclick=()=>{

  authMode =
    authMode==="login"
      ? "signup"
      : "login";

  $("authTitle").textContent =
    authMode==="login"
      ? "Zaloguj się"
      : "Załóż konto";

  $("authAction").textContent =
    authMode==="login"
      ? "Zaloguj"
      : "Zarejestruj";

  $("authSwitch").firstChild.textContent =
    authMode==="login"
      ? "Nie masz konta? "
      : "Masz już konto? ";
};


/* BALANCE */

async function loadBalance(){

  if(!currentUser)return;

  const r =
    await sb
      .from("profiles")
      .select("psc_balance,username")
      .eq("id",currentUser.id)
      .maybeSingle();

  if(
    r.data &&
    $("bal")
  ){

    $("bal").textContent =
      "🪙 " +
      Number(
        r.data.psc_balance || 0
      ).toFixed(2) +
      " zł";
  }
}


/* CHANNEL */

async function getOrCreateChannel(){

  if(!currentUser){
    throw new Error(
      "Musisz być zalogowany."
    );
  }

  let r =
    await sb
      .from("channels")
      .select("id,name,owner_id")
      .eq("owner_id",currentUser.id)
      .limit(1)
      .maybeSingle();

  if(r.error){
    throw new Error(r.error.message);
  }

  if(r.data){
    return r.data;
  }

  const username =
    currentUser.user_metadata?.username ||
    currentUser.email?.split("@")[0] ||
    "Użytkownik";

  r =
    await sb
      .from("channels")
      .insert({
        owner_id:currentUser.id,
        name:username+" - kanał",
        description:"Kanał SillyTube"
      })
      .select("id,name,owner_id")
      .single();

  if(r.error){

    throw new Error(
      "Nie udało się utworzyć kanału: " +
      r.error.message
    );
  }

  return r.data;
}

/* TUS UPLOAD */

async function uploadLargeFile(
  file,
  path,
  bucket,
  contentType,
  onProgress
){

  const {
    data:{
      session
    }
  } =
    await sb.auth.getSession();

  if(!session){
    throw new Error(
      "Sesja wygasła. Zaloguj się ponownie."
    );
  }

  return new Promise(
    (resolve,reject)=>{

      const upload =
        new tus.Upload(
          file,
          {

            endpoint:
              "https://czyklqosqoqxgaxoejpz.storage.supabase.co/storage/v1/upload/resumable",

            retryDelays:[
              0,
              3000,
              5000,
              10000,
              20000
            ],

            headers:{
              authorization:
                "Bearer " +
                session.access_token,

              "x-upsert":
                "false"
            },

            metadata:{
              bucketName:bucket,
              objectName:path,
              contentType:
                contentType ||
                "application/octet-stream",
              cacheControl:"3600"
            },

            chunkSize:
              6 * 1024 * 1024,

            uploadDataDuringCreation:true,

            removeFingerprintOnSuccess:true,

            onError(error){

              reject(
                new Error(
                  error?.message ||
                  "Błąd uploadu."
                )
              );
            },

            onProgress(bytesUploaded,bytesTotal){

              const percent =
                Math.floor(
                  (bytesUploaded /
                  bytesTotal) * 100
                );

              if(onProgress){
                onProgress(
                  percent,
                  bytesUploaded,
                  bytesTotal
                );
              }
            },

            onSuccess(){

              resolve(true);
            }

          }
        );

      upload.start();

    }
  );
}


/* PUBLISH */

$("publish").onclick=async()=>{

  const title =
    $("videoTitle").value.trim();

  const description =
    $("videoDescription").value.trim();

  const vf =
    $("videoFile").files[0];

  const tf =
    $("thumbFile").files[0];

  const status =
    $("uploadStatus");

  const btn =
    $("publish");

  const progressWrap =
    $("uploadProgressWrap");

  const progressBar =
    $("uploadProgressBar");

  const progressText =
    $("uploadProgressText");

  if(!currentUser){
    return msg(
      status,
      "Musisz być zalogowany."
    );
  }

  if(!title){
    return msg(
      status,
      "Podaj tytuł filmu."
    );
  }

  if(!vf){
    return msg(
      status,
      "Wybierz film."
    );
  }

  if(vf.size > MAX_VIDEO_SIZE){

    return msg(
      status,
      "Film jest większy niż 10 GB."
    );
  }

  btn.disabled=true;

  progressWrap.style.display="block";

  let vp=null;
  let tp=null;

  try{

    msg(
      status,
      "Sprawdzanie kanału..."
    );

    const ch =
      await getOrCreateChannel();

    const safe =
      (vf.name || "video")
        .replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );

    vp =
      `${currentUser.id}/${Date.now()}-${safe}`;

    msg(
      status,
      "Wysyłanie filmu... Nie zamykaj karty."
    );

    await uploadLargeFile(
      vf,
      vp,
      "videos",
      vf.type || "video/mp4",
      (percent)=>{

        progressBar.style.width =
          percent + "%";

        progressText.textContent =
          "Upload filmu: " +
          percent +
          "%";

      }
    );

    progressBar.style.width="100%";

    progressText.textContent =
      "Film wysłany — 100%";

    if(tf){

      msg(
        status,
        "Wysyłanie miniaturki..."
      );

      const ts =
        (tf.name || "thumbnail")
          .replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );

      tp =
        `${currentUser.id}/${Date.now()}-${ts}`;

      const r =
        await sb
          .storage
          .from("thumbnails")
          .upload(
            tp,
            tf,
            {
              upsert:false,
              contentType:
                tf.type
            }
          );

      if(r.error){

        await sb
          .storage
          .from("videos")
          .remove([vp]);

        throw new Error(
          "Błąd miniaturki: " +
          r.error.message
        );
      }
    }

    msg(
      status,
      "Zapisywanie filmu..."
    );

    const r =
      await sb
        .from("videos")
        .insert({
          owner_id:currentUser.id,
          channel_id:ch.id,
          title,
          description,
          video_path:vp,
          thumbnail_path:tp
        });

    if(r.error){

      await sb
        .storage
        .from("videos")
        .remove([vp]);

      if(tp){

        await sb
          .storage
          .from("thumbnails")
          .remove([tp]);
      }

      throw new Error(
        "Nie udało się zapisać filmu: " +
        r.error.message
      );
    }

    msg(
      status,
      "Film opublikowany! 🎉",
      true
    );

    setTimeout(
      ()=>{
        closeModal("uploadModal");

        [
          "videoTitle",
          "videoDescription",
          "videoFile",
          "thumbFile"
        ].forEach(
          id=>{
            $(id).value="";
          }
        );

        progressWrap.style.display="none";
        progressBar.style.width="0%";
        progressText.textContent="0%";
        status.style.display="none";

        loadVideos();

      },
      900
    );

  }catch(e){

    msg(
      status,
      e.message ||
      "Nieznany błąd."
    );

  }finally{

    btn.disabled=false;

  }
};


/* VIDEOS */

async function loadVideos(){

  const q =
    $("search").value.trim();

  let query =
    sb
      .from("videos")
      .select("*")
      .order(
        "created_at",
        {ascending:false}
      );

  if(q){

    query =
      query.ilike(
        "title",
        "%" + q + "%"
      );
  }

  const r =
    await query;

  const list =
    $("list");

  if(r.error){

    list.innerHTML = `
      <div class="empty">
        <div class="big">⚠️</div>
        <h2>Błąd ładowania filmów</h2>
        <p class="muted">
          ${esc(r.error.message)}
        </p>
      </div>
    `;

    return;
  }

  let videos =
    r.data || [];

  if(
    activeTab==="subscriptions" &&
    currentUser
  ){

    const s =
      await sb
        .from("subscriptions")
        .select("channel_id")
        .eq(
          "subscriber_id",
          currentUser.id
        );

    const ids =
      (s.data || [])
        .map(x=>x.channel_id);

    videos =
      ids.length
        ? videos.filter(
            v=>ids.includes(
              v.channel_id
            )
          )
        : [];
  }

  if(!videos.length){

    list.innerHTML = `
      <div class="empty">
        <div class="big">🎬</div>
        <h2>Nie ma jeszcze filmów</h2>

        <p class="muted">
          ${
            activeTab==="subscriptions"
              ? "Zasubskrybuj kanał, aby zobaczyć jego filmy."
              : "Zaloguj się i wrzuć pierwszy film."
          }
        </p>

      </div>
    `;

    return;
  }

  const ids =
    [
      ...new Set(
        videos
          .map(v=>v.channel_id)
          .filter(Boolean)
      )
    ];

  let channels=[];

  if(ids.length){

    const cr =
      await sb
        .from("channels")
        .select(
          "id,name,owner_id"
        )
        .in(
          "id",
          ids
        );

    channels =
      cr.data || [];
  }

  const cmap =
    Object.fromEntries(
      channels.map(
        c=>[c.id,c]
      )
    );

  const likeCounts =
    await Promise.all(
      videos.map(
        v =>
          sb
            .from("video_likes")
            .select(
              "id",
              {
                count:"exact",
                head:true
              }
            )
            .eq(
              "video_id",
              v.id
            )
      )
    );

  list.innerHTML = `
    <div class="grid">

      ${videos.map((v,i)=>{

        const vu =
          sb.storage
            .from("videos")
            .getPublicUrl(
              v.video_path
            )
            .data.publicUrl;

        const tu =
          v.thumbnail_path
            ? sb.storage
                .from("thumbnails")
                .getPublicUrl(
                  v.thumbnail_path
                )
                .data.publicUrl
            : "";

        const c =
          cmap[v.channel_id];

        const likes =
          likeCounts[i]?.count || 0;

        return `

          <article class="card">

            <video
              class="thumb"
              src="${esc(vu)}"
              ${
                tu
                  ? `poster="${esc(tu)}"`
                  : ""
              }
              controls
              preload="metadata"
            ></video>

            <div class="info">

              <div class="title">
                ${esc(v.title)}
              </div>

              ${
                v.description
                  ? `
                    <div class="description">
                      ${esc(v.description)}
                    </div>
                  `
                  : ""
              }

              <div class="meta">
                ${esc(c?.name || "SillyTube")}
                ·
                ${
                  v.created_at
                    ? new Date(
                        v.created_at
                      ).toLocaleDateString(
                        "pl-PL"
                      )
                    : ""
                }
              </div>

              <div class="actions">

                <button
                  class="small-btn"
                  onclick="likeVideo('${v.id}')"
                >
                  👍 ${likes}
                </button>

                <button
                  class="small-btn"
                  onclick="openComments('${v.id}')"
                >
                  💬 Komentarze
                </button>

                ${
                  v.channel_id
                    ? `
                      <button
                        class="small-btn"
                        onclick="subscribe('${v.channel_id}')"
                      >
                        🔔 Sub
                      </button>

                      <button
                        class="small-btn"
                        onclick="openMembership(
                          '${v.channel_id}',
                          '${esc(c?.name || "Kanał")}'
                        )"
                      >
                        ⭐ Membership
                      </button>
                    `
                    : ""
                }

              </div>

            </div>

          </article>

        `;

      }).join("")}

    </div>
  `;
}


/* SEARCH */

let searchTimer;

$("search").oninput=()=>{

  clearTimeout(searchTimer);

  searchTimer =
    setTimeout(
      loadVideos,
      250
    );
};


/* LIKE */

async function likeVideo(videoId){

  let visitorId =
    localStorage.getItem(
      "sillytube_visitor_id"
    );

  if(!visitorId){

    visitorId =
      crypto.randomUUID();

    localStorage.setItem(
      "sillytube_visitor_id",
      visitorId
    );
  }

  const r =
    await sb
      .from("video_likes")
      .insert({
        video_id:videoId,
        visitor_id:visitorId
      });

  if(r.error){

    alert(
      r.error.code==="23505"
        ? "Już polubiłeś ten film 👍"
        : "Błąd lajka: " +
          r.error.message
    );

  }else{

    alert("Polubiono 👍");

    loadVideos();
  }
}


/* SUBSCRIBE */

async function subscribe(channelId){

  if(!requireAuth())return;

  if(
    channelId ===
    (await getOrCreateChannel()).id
  ){

    return alert(
      "Nie możesz subskrybować własnego kanału."
    );
  }

  const r =
    await sb
      .from("subscriptions")
      .insert({
        subscriber_id:
          currentUser.id,
        channel_id:
          channelId
      });

  if(r.error){

    alert(
      r.error.code==="23505"
        ? "Już subskrybujesz ten kanał."
        : r.error.message
    );

  }else{

    alert(
      "Subskrypcja dodana! 🔔"
    );
  }
}


/* COMMENTS */

async function openComments(videoId){

  activeVideoId =
    videoId;

  $("commentsList").innerHTML =
    "<p class='muted'>Ładowanie...</p>";

  openModal(
    "commentsModal"
  );

  const r =
    await sb
      .from("comments")
      .select("*")
      .eq(
        "video_id",
        videoId
      )
      .order(
        "created_at",
        {
          ascending:false
        }
      );

  if(r.error){

    $("commentsList").innerHTML = `
      <p class="muted">
        ${esc(r.error.message)}
      </p>
    `;

    return;
  }

  $("commentsList").innerHTML =
    (r.data || []).length

      ? (r.data || []).map(
          c=>`

            <div class="comment">

              <strong>
                Użytkownik
              </strong>

              <span>
                ${esc(c.content)}
              </span>

              <div class="meta">
                ${
                  new Date(
                    c.created_at
                  ).toLocaleString(
                    "pl-PL"
                  )
                }
              </div>

            </div>

          `
        ).join("")

      : "<p class='muted'>Brak komentarzy.</p>";
}


$("sendComment").onclick =
  async()=>{

    if(!requireAuth())return;

    const content =
      $("commentText")
        .value
        .trim();

    const st =
      $("commentStatus");

    if(!content){

      return msg(
        st,
        "Napisz komentarz."
      );
    }

    const r =
      await sb
        .from("comments")
        .insert({
          video_id:
            activeVideoId,
          user_id:
            currentUser.id,
          content
        });

    if(r.error){

      msg(
        st,
        r.error.message
      );

    }else{

      $("commentText").value="";

      msg(
        st,
        "Komentarz dodany.",
        true
      );

      openComments(
        activeVideoId
      );
    }
  };


/* MEMBERSHIP */

async function openMembership(
  channelId,
  name
){

  if(!requireAuth())return;

  activeChannelId =
    channelId;

  $("membershipChannel")
    .textContent =
      "Kanał: " + name;

  openModal(
    "membershipModal"
  );
}


$("joinMembership").onclick =
  async()=>{

    if(
      !currentUser ||
      !activeChannelId
    )return;

    const amount =
      Number(
        $("membershipTier")
          .value
      );

    const st =
      $("membershipStatus");

    const p =
      await sb
        .from("profiles")
        .select(
          "psc_balance"
        )
        .eq(
          "id",
          currentUser.id
        )
        .maybeSingle();

    const bal =
      Number(
        p.data?.psc_balance || 0
      );

    if(p.error){

      return msg(
        st,
        p.error.message
      );
    }

    if(bal < amount){

      return msg(
        st,
        `Za mało wirtualnego salda. Masz ${bal.toFixed(2)} zł.`
      );
    }

    const r =
      await sb.rpc(
        "join_channel_membership",
        {
          p_channel_id:
            activeChannelId,

          p_amount:
            amount,

          p_tier:
            $("membershipTier")
              .selectedOptions[0]
              .text
              .split(" — ")[0]
        }
      );

    if(r.error){

      return msg(
        st,
        r.error.message
      );
    }

    msg(
      st,
      "Członkostwo aktywne! ⭐",
      true
    );

    loadBalance();
  };


/* PROFILE */

async function showMyProfile(){

  if(!currentUser)return;

  const r =
    await sb
      .from("profiles")
      .select(
        "username,psc_balance"
      )
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();

  const ch =
    await getOrCreateChannel();

  const vc =
    await sb
      .from("videos")
      .select(
        "id",
        {
          count:"exact",
          head:true
        }
      )
      .eq(
        "owner_id",
        currentUser.id
      );

  $("profileArea").innerHTML = `

    <div class="profile">

      <div class="avatar">
        ${avatarLetter()}
      </div>

      <div>

        <h2>
          ${
            esc(
              r.data?.username ||
              currentUser.email
                ?.split("@")[0] ||
              "Użytkownik"
            )
          }
        </h2>

        <div class="muted">

          ${esc(currentUser.email || "")}

          ·

          ${vc.count || 0} filmów

          ·

          🪙
          ${Number(
            r.data?.psc_balance || 0
          ).toFixed(2)}
          zł

        </div>

        <p class="muted">
          ${esc(ch.name)}
        </p>

      </div>

    </div>

  `;

  $("watchArea").innerHTML="";

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* TABS */

document
  .querySelectorAll(".tab")
  .forEach(
    b=>{

      b.onclick=()=>{

        document
          .querySelectorAll(".tab")
          .forEach(
            x=>
              x.classList.remove(
                "active"
              )
          );

        b.classList.add(
          "active"
        );

        activeTab =
          b.dataset.tab;

        if(
          activeTab==="memberships"
        ){

          showMemberships();

        }else if(
          activeTab==="playlists"
        ){

          showPlaylists();

        }else{

          $("profileArea")
            .innerHTML="";

          loadVideos();
        }
      };

    }
  );


/* MEMBERSHIPS */

async function showMemberships(){

  $("profileArea").innerHTML = `

    <div class="empty">

      <div class="big">⭐</div>

      <h2>
        Członkostwa kanałów
      </h2>

      <p class="muted">
        Otwórz film i kliknij
        „Membership”, aby dołączyć
        do kanału.
      </p>

  `;

}


/* PLAYLISTS */

async function showPlaylists(){

  if(!requireAuth())return;

  $("profileArea").innerHTML = `

    <div class="empty">

      <div class="big">📚</div>

      <h2>Playlisty</h2>

      <p class="muted">
        Panel playlist jest przygotowany
        pod tabelę playlists/playlist_items.
      </p>

    </div>

  `;

  $("list").innerHTML="";
}


/* PROMO */

$("redeem").onclick =
  async()=>{

    const code =
      $("promoCode")
        .value
        .trim();

    const st =
      $("codeStatus");

    if(!code)return;

    const r =
      await sb.rpc(
        "redeem_promo",
        {
          p_code:code
        }
      );

    if(r.error){

      msg(
        st,
        r.error.message
      );

    }else{

      msg(
        st,
        "Dodano " +
        Number(r.data)
          .toFixed(2) +
        " zł.",
        true
      );

      $("promoCode").value="";

      loadBalance();
    }
  };
