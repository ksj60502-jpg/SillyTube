<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SillyTube</title>
<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
window.sb = createClient("https://czyklqosqoqxgaxoejpz.supabase.co", "sb_publishable_xChRH3i5kMb0ErQALcXKHA_Gogcykzj");
</script>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f0f0f;color:#fff;font:15px Arial,sans-serif}
header{height:64px;background:#181818;border-bottom:1px solid #292929;display:flex;align-items:center;gap:18px;padding:0 22px;position:sticky;top:0;z-index:5}
.logo{font-size:23px;font-weight:800;white-space:nowrap}.logo span{background:#f03;padding:7px 10px;border-radius:9px;margin-right:7px}
.search{flex:1;max-width:620px;margin:auto}.search input{width:100%;background:#101010;color:white;border:1px solid #444;border-radius:24px;padding:11px 16px;outline:none}
.btn{border:0;border-radius:10px;padding:10px 15px;font-weight:700;cursor:pointer}.red{background:#f03;color:#fff}.gray{background:#303030;color:#fff}.green{color:#5ee68a;font-weight:800}
.main{max-width:1250px;margin:auto;padding:25px 20px}.hero{background:linear-gradient(120deg,#25102a,#121c35);border:1px solid #303030;border-radius:18px;padding:26px;margin-bottom:25px}
.hero h1{margin:0 0 8px;font-size:34px}.muted{color:#999}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{background:#181818;border-radius:12px;overflow:hidden}.thumb{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#292929}.info{padding:13px}.title{font-weight:700;font-size:16px}.meta{color:#999;font-size:13px;margin-top:7px}
.modal{display:none;position:fixed;inset:0;background:#000c;z-index:20;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}
.box{width:min(540px,100%);background:#181818;border:1px solid #444;border-radius:18px;padding:24px;max-height:90vh;overflow:auto}
.box h2{margin-top:0}.box input{width:100%;padding:11px;margin:7px 0 14px;background:#101010;color:white;border:1px solid #444;border-radius:9px}
.row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}.status{padding:12px;border-radius:10px;background:#222;margin:10px 0;display:none}
.empty{text-align:center;padding:65px 20px;border:1px dashed #444;border-radius:18px;background:#141414}.empty .big{font-size:55px}
.userbox{display:flex;align-items:center;gap:8px;white-space:nowrap}.balance{color:#5ee68a;font-weight:800}
@media(max-width:700px){header{padding:0 10px;gap:8px}.logo{font-size:17px}.search{display:none}.main{padding:16px 12px}}
</style>
</head>
<body>
<header>
 <div class="logo"><span>▶</span>SillyTube</div>
 <div class="green">100% FREE</div>
 <div class="search"><input id="search" placeholder="Szukaj filmów..."></div>
 <div id="account"><button class="btn gray" id="loginBtn">Zaloguj się</button></div>
</header>
<main class="main">
<section class="hero"><h1>SillyTube 🎬</h1><p>Darmowa platforma wideo.</p>
<p class="muted">Subskrypcje dają twórcy <b>10 zł wirtualnego salda</b>. To saldo nie jest prawdziwymi pieniędzmi ani prawdziwym PSC.</p>
<button class="btn red" id="uploadBtn">⬆ Upload filmu</button>
<button class="btn gray" id="codeBtn">🎟 Kod</button>
</section>
<div id="list"></div>
</main>

<div class="modal" id="authModal"><div class="box">
<h2 id="authTitle">Zaloguj się</h2>
<input id="authEmail" type="email" placeholder="E-mail"><input id="authPass" type="password" placeholder="Hasło">
<div class="row"><button class="btn gray" onclick="closeModal('authModal')">Anuluj</button><button class="btn red" id="authAction">Zaloguj</button></div>
<p class="muted" id="authSwitch">Nie masz konta? <button class="btn gray" id="switchAuth">Załóż konto</button></p>
<div class="status" id="authStatus"></div></div></div>

<div class="modal" id="uploadModal"><div class="box">
<h2>Upload filmu</h2>
<input id="videoTitle" placeholder="Tytuł filmu">
<label class="muted">Film</label><input id="videoFile" type="file" accept="video/*">
<label class="muted">Custom thumbnail (JPG, PNG lub GIF)</label><input id="thumbFile" type="file" accept="image/jpeg,image/png,image/gif">
<div class="status" id="uploadStatus"></div>
<div class="row"><button class="btn gray" onclick="closeModal('uploadModal')">Anuluj</button><button class="btn red" id="publish">Opublikuj</button></div>
</div></div>

<div class="modal" id="codeModal"><div class="box">
<h2>Wpisz kod</h2><input id="promoCode" placeholder="Np. SILLY10">
<div class="row"><button class="btn gray" onclick="closeModal('codeModal')">Anuluj</button><button class="btn red" id="redeem">Zrealizuj</button></div>
<div class="status" id="codeStatus"></div></div></div>

<script>
let currentUser=null, authMode='login', channels=[];
const $=id=>document.getElementById(id);
function openModal(id){$(id).classList.add('open')}function closeModal(id){$(id).classList.remove('open')}
function msg(el,text,ok=false){el.style.display='block';el.textContent=text;el.style.color=ok?'#5ee68a':'#ff8a8a'}

async function init(){
 const {data}=await sb.auth.getSession(); currentUser=data.session?.user||null;
 sb.auth.onAuthStateChange((_e,s)=>{currentUser=s?.user||null; renderAccount(); loadVideos();});
 renderAccount(); loadVideos();
}
function renderAccount(){
 const a=$('account');
 if(!currentUser){a.innerHTML='<button class="btn gray" id="loginBtn">Zaloguj się</button>'; $('loginBtn').onclick=()=>openAuth(); return}
 a.innerHTML='<div class="userbox"><span id="bal" class="balance">🪙 ...</span><button class="btn gray" id="logout">Wyloguj</button></div>';
 $('logout').onclick=async()=>{await sb.auth.signOut()};
 loadBalance();
}
function openAuth(){openModal('authModal');}
$('authAction').onclick=async()=>{
 const email=$('authEmail').value.trim(), password=$('authPass').value;
 const st=$('authStatus'); if(!email||password.length<6) return msg(st,'Podaj e-mail i hasło (min. 6 znaków).');
 let r=authMode==='login'?await sb.auth.signInWithPassword({email,password}):await sb.auth.signUp({email,password});
 if(r.error)return msg(st,r.error.message);
 if(authMode==='signup')msg(st,'Konto utworzone. Sprawdź e-mail, aby potwierdzić konto.',true);else closeModal('authModal');
};
$('switchAuth').onclick=()=>{authMode=authMode==='login'?'signup':'login';$('authTitle').textContent=authMode==='login'?'Zaloguj się':'Załóż konto';$('authAction').textContent=authMode==='login'?'Zaloguj':'Zarejestruj';$('authSwitch').firstChild.textContent=authMode==='login'?'Nie masz konta? ':'Masz już konto? '};

$('uploadBtn').onclick=()=>{if(!currentUser)return openAuth();openModal('uploadModal')};
$('codeBtn').onclick=()=>{if(!currentUser)return openAuth();openModal('codeModal')};

async function loadBalance(){
 if(!currentUser)return;
 const {data}=await sb.from('profiles').select('psc_balance,username').eq('id',currentUser.id).single();
 if(data&&$('bal'))$('bal').textContent='🪙 '+Number(data.psc_balance).toFixed(2)+' zł';
}
$('redeem').onclick=async()=>{
 const code=$('promoCode').value.trim(),st=$('codeStatus'); if(!code)return;
 const {data,error}=await sb.rpc('redeem_promo',{p_code:code});
 if(error)return msg(st,error.message);
 msg(st,'Dodano '+Number(data).toFixed(2)+' zł do wirtualnego salda.',true);$('promoCode').value='';loadBalance();
};
$('publish').onclick=async()=>{
 const title=$('videoTitle').value.trim(), vf=$('videoFile').files[0], tf=$('thumbFile').files[0], st=$('uploadStatus');
 if(!title||!vf)return msg(st,'Podaj tytuł i wybierz film.');
 if(vf.size>500*1024*1024)return msg(st,'Film jest większy niż 500 MB.');
 msg(st,'Wysyłanie filmu...');
 const safe=(vf.name||'video').replace(/[^a-zA-Z0-9._-]/g,'_'), base=currentUser.id+'/'+Date.now()+'-'+safe;
 let r=await sb.storage.from('videos').upload(base,vf,{upsert:false,contentType:vf.type});
 if(r.error)return msg(st,r.error.message);
 let thumbPath=null;
 if(tf){
   const ts=(tf.name||'thumb').replace(/[^a-zA-Z0-9._-]/g,'_');
   thumbPath=currentUser.id+'/'+Date.now()+'-'+ts;
   r=await sb.storage.from('thumbnails').upload(thumbPath,tf,{upsert:false,contentType:tf.type});
   if(r.error){await sb.storage.from('videos').remove([base]);return msg(st,r.error.message)}
 }
 const channel=await sb.from('channels').select('id').eq('owner_id',currentUser.id).limit(1).maybeSingle();
 if(channel.error||!channel.data){await sb.storage.from('videos').remove([base]);return msg(st,'Nie znaleziono kanału.')}
 r=await sb.from('videos').insert({owner_id:currentUser.id,channel_id:channel.data.id,title,video_path:base,thumbnail_path:thumbPath});
 if(r.error){await sb.storage.from('videos').remove([base]);if(thumbPath)await sb.storage.from('thumbnails').remove([thumbPath]);return msg(st,r.error.message)}
 msg(st,'Film opublikowany!',true);setTimeout(()=>{closeModal('uploadModal');loadVideos()},700);
};
async function loadVideos(){
 let q=$('search').value.trim();
 let query=sb.from('videos').select('id,title,video_path,thumbnail_path,created_at,channel_id,channels(id,name,owner_id)').order('created_at',{ascending:false});
 if(q)query=query.ilike('title','%'+q+'%');
 const {data,error}=await query;
 const el=$('list'); if(error)return el.innerHTML='<div class="empty">Błąd: '+error.message+'</div>';
 if(!data?.length)return el.innerHTML='<div class="empty"><div class="big">🎬</div><h2>Nie ma jeszcze żadnych filmów</h2><p class="muted">Zaloguj się i wrzuć pierwszy film.</p></div>';
 el.innerHTML='<div class="grid">'+data.map(v=>{
   const video=sb.storage.from('videos').getPublicUrl(v.video_path).data.publicUrl;
   const thumb=v.thumbnail_path?sb.storage.from('thumbnails').getPublicUrl(v.thumbnail_path).data.publicUrl:'';
   const ch=v.channels;
   return `<article class="card"><video class="thumb" src="${video}" ${thumb?'poster="'+thumb+'"':''} controls preload="metadata"></video><div class="info"><div class="title">${esc(v.title)}</div><div class="meta">${esc(ch?.name||'Kanał')} · <button class="btn gray" style="padding:6px 9px" onclick="subscribe('${ch?.id}')">🔔 Subskrybuj</button></div></div></article>`;
 }).join('')+'</div>';
}
async function subscribe(channelId){
 if(!currentUser)return openAuth();
 const {error}=await sb.from('subscriptions').insert({subscriber_id:currentUser.id,channel_id:channelId});
 if(error){if(error.code==='23505')alert('Już subskrybujesz ten kanał.');else alert(error.message);return}
 alert('Subskrypcja dodana! Twórca otrzyma +10 zł wirtualnego salda.');
}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
$('search').addEventListener('input',loadVideos);
init();
</script>
</body></html>
