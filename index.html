<script>

  let currentUser = null;

  let authMode = "login";


  /* =================================================
     POMOCNICZE
     ================================================= */

  const $ = id =>
    document.getElementById(id);


  function openModal(id) {

    $(id).classList.add("open");

  }


  function closeModal(id) {

    $(id).classList.remove("open");

  }


  function msg(el, text, ok = false) {

    el.style.display = "block";

    el.textContent = text;

    el.style.color =
      ok
        ? "#5ee68a"
        : "#ff8a8a";

  }


  function esc(value) {

    return String(value ?? "")
      .replace(
        /[&<>"']/g,
        function(m) {

          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          }[m];

        }
      );

  }


  /* =================================================
     START
     ================================================= */

  async function init() {

    const result =
      await sb.auth.getSession();


    currentUser =
      result.data.session?.user ||
      null;


    sb.auth.onAuthStateChange(
      function(_event, session) {

        currentUser =
          session?.user ||
          null;


        renderAccount();

        loadVideos();

      }
    );


    renderAccount();

    loadVideos();

  }


  /* =================================================
     KONTO
     ================================================= */

  function renderAccount() {

    const account =
      $("account");


    if (!currentUser) {

      account.innerHTML = `
        <button
          class="btn gray"
          id="loginBtn"
        >
          Zaloguj się
        </button>
      `;


      $("loginBtn").onclick =
        function() {

          openAuth();

        };


      return;

    }


    account.innerHTML = `
      <div class="userbox">

        <span
          id="bal"
          class="balance"
        >
          🪙 ...
        </span>

        <button
          class="btn gray"
          id="logout"
        >
          Wyloguj
        </button>

      </div>
    `;


    $("logout").onclick =
      async function() {

        await sb.auth.signOut();

      };


    loadBalance();

  }


  function openAuth() {

    openModal("authModal");

  }


  $("authAction").onclick =
    async function() {

      const email =
        $("authEmail")
          .value
          .trim();


      const password =
        $("authPass")
          .value;


      const status =
        $("authStatus");


      if (
        !email ||
        password.length < 6
      ) {

        msg(
          status,
          "Podaj e-mail i hasło (minimum 6 znaków)."
        );

        return;

      }


      let result;


      if (authMode === "login") {

        result =
          await sb.auth.signInWithPassword({
            email,
            password
          });

      } else {

        result =
          await sb.auth.signUp({
            email,
            password
          });

      }


      if (result.error) {

        msg(
          status,
          result.error.message
        );

        return;

      }


      if (
        authMode === "signup"
      ) {

        msg(
          status,
          "Konto utworzone. Sprawdź e-mail.",
          true
        );

      } else {

        closeModal(
          "authModal"
        );

      }

    };


  $("switchAuth").onclick =
    function() {

      authMode =
        authMode === "login"
          ? "signup"
          : "login";


      $("authTitle").textContent =
        authMode === "login"
          ? "Zaloguj się"
          : "Załóż konto";


      $("authAction").textContent =
        authMode === "login"
          ? "Zaloguj"
          : "Zarejestruj";


      $("authSwitch").firstChild
        .textContent =
          authMode === "login"
            ? "Nie masz konta? "
            : "Masz już konto? ";

    };


  /* =================================================
     BALANS
     ================================================= */

  async function loadBalance() {

    if (!currentUser)
      return;


    const result =
      await sb
        .from("profiles")
        .select(
          "psc_balance,username"
        )
        .eq(
          "id",
          currentUser.id
        )
        .maybeSingle();


    if (
      result.data &&
      $("bal")
    ) {

      $("bal").textContent =
        "🪙 " +
        Number(
          result.data.psc_balance || 0
        ).toFixed(2) +
        " zł";

    }

  }


  /* =================================================
     KANAŁ
     ================================================= */

  async function getOrCreateChannel() {

    if (!currentUser) {

      throw new Error(
        "Musisz być zalogowany."
      );

    }


    let result =
      await sb
        .from("channels")
        .select(
          "id,name,owner_id"
        )
        .eq(
          "owner_id",
          currentUser.id
        )
        .limit(1)
        .maybeSingle();


    if (result.error) {

      throw new Error(
        result.error.message
      );

    }


    if (result.data) {

      return result.data;

    }


    let username =
      currentUser
        .user_metadata
        ?.username;


    if (!username) {

      username =
        currentUser.email
          ?.split("@")[0];

    }


    username =
      username ||
      "Użytkownik";


    result =
      await sb
        .from("channels")
        .insert({
          owner_id:
            currentUser.id,

          name:
            username +
            " - kanał",

          description:
            "Kanał SillyTube"
        })
        .select(
          "id,name,owner_id"
        )
        .single();


    if (result.error) {

      throw new Error(
        "Nie udało się utworzyć kanału: " +
        result.error.message
      );

    }


    return result.data;

  }


  /* =================================================
     OTWARCIE UPLOADU
     ================================================= */

  $("uploadBtn").onclick =
    function() {

      if (!currentUser) {

        openAuth();

        return;

      }


      openModal(
        "uploadModal"
      );

    };


  $("videoFile").addEventListener(
    "change",
    function() {

      const file =
        $("videoFile").files[0];


      if (!file) {

        $("videoFileInfo")
          .textContent = "";

        return;

      }


      $("videoFileInfo")
        .textContent =
          "Wybrano: " +
          file.name +
          " (" +
          (
            file.size /
            1024 /
            1024
          ).toFixed(1) +
          " MB)";

    }
  );


  /* =================================================
     UPLOAD
     ================================================= */

  $("publish").onclick =
    async function() {

      const title =
        $("videoTitle")
          .value
          .trim();


      const description =
        $("videoDescription")
          .value
          .trim();


      const videoFile =
        $("videoFile")
          .files[0];


      const thumbFile =
        $("thumbFile")
          .files[0];


      const status =
        $("uploadStatus");


      if (!currentUser) {

        msg(
          status,
          "Musisz być zalogowany."
        );

        return;

      }


      if (!title) {

        msg(
          status,
          "Podaj tytuł filmu."
        );

        return;

      }


      if (!videoFile) {

        msg(
          status,
          "Wybierz film."
        );

        return;

      }


      if (
        videoFile.size >
        500 * 1024 * 1024
      ) {

        msg(
          status,
          "Film jest większy niż 500 MB."
        );

        return;

      }


      const publish =
        $("publish");


      publish.disabled = true;


      let videoPath = null;

      let thumbnailPath = null;


      try {

        msg(
          status,
          "Sprawdzanie kanału..."
        );


        const channel =
          await getOrCreateChannel();


        msg(
          status,
          "Wysyłanie filmu..."
        );


        const safeName =
          (
            videoFile.name ||
            "video"
          )
            .replace(
              /[^a-zA-Z0-9._-]/g,
              "_"
            );


        videoPath =
          currentUser.id +
          "/" +
          Date.now() +
          "-" +
          safeName;


        let result =
          await sb
            .storage
            .from("videos")
            .upload(
              videoPath,
              videoFile,
              {
                upsert: false,
                contentType:
                  videoFile.type ||
                  "video/mp4"
              }
            );


        if (result.error) {

          throw new Error(
            "Błąd uploadu filmu: " +
            result.error.message
          );

        }


        /* MINIATURKA */

        if (thumbFile) {

          const safeThumb =
            (
              thumbFile.name ||
              "thumbnail"
            )
              .replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
              );


          thumbnailPath =
            currentUser.id +
            "/" +
            Date.now() +
            "-" +
            safeThumb;


          result =
            await sb
              .storage
              .from("thumbnails")
              .upload(
                thumbnailPath,
                thumbFile,
                {
                  upsert: false,
                  contentType:
                    thumbFile.type
                }
              );


          if (result.error) {

            await sb
              .storage
              .from("videos")
              .remove([
                videoPath
              ]);


            throw new Error(
              "Błąd miniaturki: " +
              result.error.message
            );

          }

        }


        /* ZAPIS W BAZIE */

        result =
          await sb
            .from("videos")
            .insert({
              owner_id:
                currentUser.id,

              channel_id:
                channel.id,

              title:
                title,

              description:
                description,

              video_path:
                videoPath,

              thumbnail_path:
                thumbnailPath
            });


        if (result.error) {

          await sb
            .storage
            .from("videos")
            .remove([
              videoPath
            ]);


          if (thumbnailPath) {

            await sb
              .storage
              .from("thumbnails")
              .remove([
                thumbnailPath
              ]);

          }


          throw new Error(
            "Nie udało się zapisać filmu w bazie: " +
            result.error.message
          );

        }


        msg(
          status,
          "Film opublikowany! 🎉",
          true
        );


        setTimeout(
          function() {

            closeModal(
              "uploadModal"
            );


            $("videoTitle")
              .value = "";


            $("videoDescription")
              .value = "";


            $("videoFile")
              .value = "";


            $("thumbFile")
              .value = "";


            $("videoFileInfo")
              .textContent = "";


            status.style.display =
              "none";


            loadVideos();

          },
          800
        );


      } catch (error) {

        msg(
          status,
          error.message ||
          "Nieznany błąd."
        );

      } finally {

        publish.disabled =
          false;

      }

    };


  /* =================================================
     KOD PROMOCYJNY
     ================================================= */

  $("codeBtn").onclick =
    function() {

      if (!currentUser) {

        openAuth();

        return;

      }


      openModal(
        "codeModal"
      );

    };


  $("redeem").onclick =
    async function() {

      const code =
        $("promoCode")
          .value
          .trim();


      const status =
        $("codeStatus");


      if (!code)
        return;


      const result =
        await sb.rpc(
          "redeem_promo",
          {
            p_code: code
          }
        );


      if (result.error) {

        msg(
          status,
          result.error.message
        );

        return;

      }


      msg(
        status,
        "Dodano " +
        Number(
          result.data
        ).toFixed(2) +
        " zł do wirtualnego salda.",
        true
      );


      $("promoCode")
        .value = "";


      loadBalance();

    };


  /* =================================================
     FILMY
     ================================================= */

  async function loadVideos() {

    const search =
      $("search")
        .value
        .trim();


    /*
      WAŻNE:

      Pobieramy videos bez relacji channels.

      Dzięki temu problem z kanałem
      nie ukryje wszystkich filmów.
    */

    let query =
      sb
        .from("videos")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (search) {

      query =
        query.ilike(
          "title",
          "%" +
          search +
          "%"
        );

    }


    const result =
      await query;


    const list =
      $("list");


    console.log(
      "VIDEOS:",
      result.data
    );


    console.log(
      "VIDEO ERROR:",
      result.error
    );


    if (result.error) {

      list.innerHTML = `
        <div class="empty">

          <div class="big">
            ⚠️
          </div>

          <h2>
            Błąd ładowania filmów
          </h2>

          <p class="muted">
            ${esc(
              result.error.message
            )}
          </p>

        </div>
      `;

      return;

    }


    const videos =
      result.data || [];


    if (
      videos.length === 0
    ) {

      list.innerHTML = `
        <div class="empty">

          <div class="big">
            🎬
          </div>

          <h2>
            Nie ma jeszcze żadnych filmów
          </h2>

          <p class="muted">
            Zaloguj się i wrzuć pierwszy film.
          </p>

        </div>
      `;

      return;

    }


    /*
      Pobieramy nazwy kanałów osobno.

      Jeżeli któryś kanał nie istnieje,
      film nadal zostanie pokazany.
    */

    const channelIds =
      [
        ...new Set(
          videos
            .map(
              video =>
                video.channel_id
            )
            .filter(Boolean)
        )
      ];


    let channels = [];


    if (
      channelIds.length
    ) {

      const channelResult =
        await sb
          .from("channels")
          .select(
            "id,name"
          )
          .in(
            "id",
            channelIds
          );


      if (
        !channelResult.error
      ) {

        channels =
          channelResult.data ||
          [];

      }

    }


    const channelMap =
      {};


    channels.forEach(
      channel => {

        channelMap[
          channel.id
        ] =
          channel.name;

      }
    );


    list.innerHTML = `
      <div class="grid">

        ${videos.map(
          video => {

            const videoUrl =
              sb
                .storage
                .from("videos")
                .getPublicUrl(
                  video.video_path
                )
                .data
                .publicUrl;


            let thumbnailUrl =
              "";


            if (
              video.thumbnail_path
            ) {

              thumbnailUrl =
                sb
                  .storage
                  .from("thumbnails")
                  .getPublicUrl(
                    video.thumbnail_path
                  )
                  .data
                  .publicUrl;

            }


            const channelName =
              channelMap[
                video.channel_id
              ] ||
              "SillyTube";


            return `
              <article class="card">

                <video
                  class="thumb"
                  src="${esc(videoUrl)}"
                  ${
                    thumbnailUrl
                      ? `poster="${esc(
                          thumbnailUrl
                        )}"`
                      : ""
                  }
                  controls
                  preload="metadata"
                ></video>


                <div class="info">

                  <div class="title">
                    ${esc(
                      video.title
                    )}
                  </div>


                  ${
                    video.description
                      ? `
                        <div class="description">
                          ${esc(
                            video.description
                          )}
                        </div>
                      `
                      : ""
                  }


                  <div class="meta">

                    ${esc(
                      channelName
                    )}

                    ·

                    ${
                      video.created_at
                        ? new Date(
                            video.created_at
                          ).toLocaleDateString(
                            "pl-PL"
                          )
                        : ""
                    }

                  </div>


                  <div class="actions">

                    <button
                      class="small-btn"
                      onclick="likeVideo('${video.id}')"
                    >
                      👍 Lubię to
                    </button>


                    ${
                      video.channel_id
                        ? `
                          <button
                            class="small-btn"
                            onclick="subscribe('${video.channel_id}')"
                          >
                            🔔 Subskrybuj
                          </button>
                        `
                        : ""
                    }

                  </div>

                </div>

              </article>
            `;

          }
        ).join("")}

      </div>
    `;

  }


  /* =================================================
     SZUKANIE
     ================================================= */

  let searchTimer;


  $("search").addEventListener(
    "input",
    function() {

      clearTimeout(
        searchTimer
      );


      searchTimer =
        setTimeout(
          loadVideos,
          200
        );

    }
  );


  /* =================================================
     LIKE
     ================================================= */

  async function likeVideo(
    videoId
  ) {

    let visitorId =
      localStorage.getItem(
        "sillytube_visitor_id"
      );


    if (!visitorId) {

      visitorId =
        crypto.randomUUID();


      localStorage.setItem(
        "sillytube_visitor_id",
        visitorId
      );

    }


    const result =
      await sb
        .from("video_likes")
        .insert({
          video_id:
            videoId,

          visitor_id:
            visitorId
        });


    if (result.error) {

      if (
        result.error.code ===
        "23505"
      ) {

        alert(
          "Już polubiłeś ten film 👍"
        );

      } else {

        alert(
          "Błąd lajka: " +
          result.error.message
        );

      }

      return;

    }


    alert(
      "Polubiono film 👍"
    );

  }


  /* =================================================
     SUBSKRYPCJA
     ================================================= */

  async function subscribe(
    channelId
  ) {

    if (!currentUser) {

      openAuth();

      return;

    }


    if (!channelId) {

      alert(
        "Nie znaleziono kanału."
      );

      return;

    }


    const result =
      await sb
        .from("subscriptions")
        .insert({
          subscriber_id:
            currentUser.id,

          channel_id:
            channelId
        });


    if (result.error) {

      if (
        result.error.code ===
        "23505"
      ) {

        alert(
          "Już subskrybujesz ten kanał."
        );

      } else {

        alert(
          result.error.message
        );

      }

      return;

    }


    alert(
      "Subskrypcja dodana! 🔔"
    );

  }


  /* =================================================
     URUCHOMIENIE
     ================================================= */

  init();

</script>

</body>
</html>
