  <!-- ========================= -->
  <!-- JAVASCRIPT -->
  <!-- ========================= -->

  <script>


    let currentUser = null;

    let authMode = "login";


    /* ========================= */
    /* HELPER */
    /* ========================= */


    function $(id) {

      return document.getElementById(id);

    }


    function openModal(id) {

      $(id)
        .classList
        .add("open");

    }


    function closeModal(id) {

      $(id)
        .classList
        .remove("open");

    }


    function msg(
      element,
      text,
      success = false
    ) {

      element.style.display =
        "block";


      element.textContent =
        text;


      element.style.color =
        success
          ? "#5ee68a"
          : "#ff8a8a";

    }


    /* ========================= */
    /* INITIALIZATION */
    /* ========================= */


    async function init() {

      console.log(
        "SillyTube: start"
      );


      try {

        const {
          data,
          error
        } =
          await sb.auth.getSession();


        if (error) {

          console.error(
            "Session error:",
            error
          );

        }


        currentUser =
          data?.session?.user || null;


        renderAccount();


        /*
          WAŻNE:
          ŁADUJEMY FILMY OD RAZU
        */

        await loadVideos();


        sb.auth.onAuthStateChange(
          async function (
            event,
            session
          ) {

            console.log(
              "Auth event:",
              event
            );


            currentUser =
              session?.user || null;


            renderAccount();


            await loadVideos();

          }
        );


      } catch (error) {

        console.error(
          "INIT ERROR:",
          error
        );


        $("list").innerHTML = `

          <div class="empty">

            <div class="big">
              ⚠️
            </div>

            <h2>
              Nie udało się uruchomić SillyTube
            </h2>

            <p class="muted">
              ${esc(error.message)}
            </p>

          </div>

        `;

      }

    }


    /* ========================= */
    /* ACCOUNT */
    /* ========================= */


    function renderAccount() {

      const account =
        $("account");


      if (!currentUser) {

        account.innerHTML = `

          <button
            class="btn gray"
            id="loginBtn"
          >
            Zaloguj się
          </button>

        `;


        $("loginBtn").onclick =
          openAuth;


        return;

      }


      account.innerHTML = `

        <div class="userbox">

          <span
            id="bal"
            class="balance"
          >
            🪙 ...
          </span>


          <button
            class="btn gray"
            id="logout"
          >
            Wyloguj
          </button>

        </div>

      `;


      $("logout").onclick =
        async function () {

          const {
            error
          } =
            await sb.auth.signOut();


          if (error) {

            alert(
              error.message
            );

          }

        };


      loadBalance();

    }


    function openAuth() {

      openModal(
        "authModal"
      );

    }


    /* ========================= */
    /* LOGIN / REGISTER */
    /* ========================= */


    $("authAction").onclick =
      async function () {

        const email =
          $("authEmail")
            .value
            .trim();


        const password =
          $("authPass")
            .value;


        const status =
          $("authStatus");


        if (
          !email ||
          password.length < 6
        ) {

          msg(
            status,
            "Podaj e-mail i hasło (minimum 6 znaków)."
          );

          return;

        }


        $("authAction")
          .disabled = true;


        $("authAction")
          .textContent =
          "Ładowanie...";


        let result;


        if (
          authMode === "login"
        ) {

          result =
            await sb.auth
              .signInWithPassword({

                email:
                  email,

                password:
                  password

              });

        } else {

          result =
            await sb.auth
              .signUp({

                email:
                  email,

                password:
                  password,

                options: {

                  emailRedirectTo:
                    "https://sillytube.ksj60502.workers.dev"

                }

              });

        }


        $("authAction")
          .disabled = false;


        $("authAction")
          .textContent =
          authMode === "login"
            ? "Zaloguj"
            : "Zarejestruj";


        if (result.error) {

          msg(
            status,
            result.error.message
          );

          return;

        }


        if (
          authMode === "signup"
        ) {


          if (
            result.data?.session
          ) {

            currentUser =
              result.data
                .session
                .user;


            renderAccount();


            closeModal(
              "authModal"
            );


            await loadVideos();

          } else {

            msg(
              status,

              "Konto utworzone. Sprawdź e-mail i kliknij link potwierdzający.",

              true
            );

          }


        } else {


          if (
            result.data?.session
          ) {

            currentUser =
              result.data
                .session
                .user;


            renderAccount();


            closeModal(
              "authModal"
            );


            await loadVideos();

          } else {

            msg(
              status,

              "Logowanie nie utworzyło sesji."

            );

          }

        }

      };


    /* ========================= */
    /* SWITCH AUTH */
    /* ========================= */


    $("switchAuth").onclick =
      function () {

        authMode =
          authMode === "login"
            ? "signup"
            : "login";


        $("authTitle")
          .textContent =
          authMode === "login"
            ? "Zaloguj się"
            : "Załóż konto";


        $("authAction")
          .textContent =
          authMode === "login"
            ? "Zaloguj"
            : "Zarejestruj";


        $("authSwitch")
          .firstChild
          .textContent =
          authMode === "login"
            ? "Nie masz konta? "
            : "Masz już konto? ";


        $("authStatus")
          .style
          .display =
          "none";

      };


    /* ========================= */
    /* UPLOAD BUTTON */
    /* ========================= */


    $("uploadBtn").onclick =
      function () {

        if (!currentUser) {

          openAuth();

          return;

        }


        openModal(
          "uploadModal"
        );

      };


    /* ========================= */
    /* CODE BUTTON */
    /* ========================= */


    $("codeBtn").onclick =
      function () {

        if (!currentUser) {

          openAuth();

          return;

        }


        openModal(
          "codeModal"
        );

      };


    /* ========================= */
    /* BALANCE */
    /* ========================= */


    async function loadBalance() {

      if (!currentUser) {

        return;

      }


      const {
        data,
        error
      } =
        await sb
          .from("profiles")
          .select(
            "psc_balance,username"
          )
          .eq(
            "id",
            currentUser.id
          )
          .single();


      if (error) {

        console.error(
          "Profile error:",
          error
        );

        return;

      }


      if (
        data &&
        $("bal")
      ) {

        $("bal")
          .textContent =
          "🪙 " +
          Number(
            data.psc_balance || 0
          ).toFixed(2) +
          " zł";

      }

    }


    /* ========================= */
    /* PROMO CODE */
    /* ========================= */


    $("redeem").onclick =
      async function () {

        const code =
          $("promoCode")
            .value
            .trim();


        const status =
          $("codeStatus");


        if (!code) {

          msg(
            status,
            "Wpisz kod."
          );

          return;

        }


        const {
          data,
          error
        } =
          await sb.rpc(
            "redeem_promo",
            {
              p_code:
                code
            }
          );


        if (error) {

          msg(
            status,
            error.message
          );

          return;

        }


        msg(

          status,

          "Dodano " +
            Number(data)
              .toFixed(2) +
            " zł do wirtualnego salda.",

          true

        );


        $("promoCode")
          .value = "";


        loadBalance();

      };


    /* ========================= */
    /* UPLOAD */
    /* ========================= */


    $("publish").onclick =
      async function () {

        const title =
          $("videoTitle")
            .value
            .trim();


        const videoFile =
          $("videoFile")
            .files[0];


        const thumbnailFile =
          $("thumbFile")
            .files[0];


        const status =
          $("uploadStatus");


        if (
          !title ||
          !videoFile
        ) {

          msg(
            status,
            "Podaj tytuł i wybierz film."
          );

          return;

        }


        if (
          videoFile.size >
          500 *
          1024 *
          1024
        ) {

          msg(
            status,
            "Film jest większy niż 500 MB."
          );

          return;

        }


        try {


          msg(
            status,
            "Wysyłanie filmu..."
          );


          const safeName =
            (
              videoFile.name ||
              "video"
            ).replace(
              /[^a-zA-Z0-9._-]/g,
              "_"
            );


          const videoPath =
            currentUser.id +
            "/" +
            Date.now() +
            "-" +
            safeName;


          /*
            UPLOAD VIDEO
          */

          let result =
            await sb.storage
              .from("videos")
              .upload(
                videoPath,
                videoFile,
                {

                  upsert:
                    false,

                  contentType:
                    videoFile.type

                }
              );


          if (result.error) {

            throw new Error(
              result.error.message
            );

          }


          /*
            UPLOAD THUMBNAIL
          */

          let thumbnailPath =
            null;


          if (
            thumbnailFile
          ) {


            const safeThumb =
              (
                thumbnailFile.name ||
                "thumbnail"
              ).replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
              );


            thumbnailPath =
              currentUser.id +
              "/" +
              Date.now() +
              "-" +
              safeThumb;


            result =
              await sb.storage
                .from("thumbnails")
                .upload(
                  thumbnailPath,
                  thumbnailFile,
                  {

                    upsert:
                      false,

                    contentType:
                      thumbnailFile.type

                  }
                );


            if (result.error) {

              await sb.storage
                .from("videos")
                .remove([
                  videoPath
                ]);


              throw new Error(
                result.error.message
              );

            }

          }


          /*
            FIND CHANNEL
          */

          const channel =
            await sb
              .from("channels")
              .select("id")
              .eq(
                "owner_id",
                currentUser.id
              )
              .limit(1)
              .maybeSingle();


          if (
            channel.error
          ) {

            throw new Error(
              channel.error.message
            );

          }


          if (
            !channel.data
          ) {

            await sb.storage
              .from("videos")
              .remove([
                videoPath
              ]);


            if (
              thumbnailPath
            ) {

              await sb.storage
                .from("thumbnails")
                .remove([
                  thumbnailPath
                ]);

            }


            throw new Error(
              "Nie znaleziono kanału."
            );

          }


          /*
            SAVE VIDEO
            TO DATABASE
          */

          result =
            await sb
              .from("videos")
              .insert({

                owner_id:
                  currentUser.id,

                channel_id:
                  channel.data.id,

                title:
                  title,

                video_path:
                  videoPath,

                thumbnail_path:
                  thumbnailPath

              });


          if (result.error) {

            await sb.storage
              .from("videos")
              .remove([
                videoPath
              ]);


            if (
              thumbnailPath
            ) {

              await sb.storage
                .from("thumbnails")
                .remove([
                  thumbnailPath
                ]);

            }


            throw new Error(
              result.error.message
            );

          }


          /*
            SUCCESS
          */

          msg(
            status,
            "Film opublikowany!",
            true
          );


          $("videoTitle")
            .value = "";


          $("videoFile")
            .value = "";


          $("thumbFile")
            .value = "";


          setTimeout(
            async function () {

              closeModal(
                "uploadModal"
              );


              await loadVideos();

            },
            700
          );


        } catch (error) {

          console.error(
            "UPLOAD ERROR:",
            error
          );


          msg(
            status,
            error.message
          );

        }

      };


    /* ========================= */
    /* LOAD VIDEOS */
    /* ========================= */


    async function loadVideos() {

      const search =
        $("search")
          .value
          .trim();


      console.log(
        "Loading videos..."
      );


      let query =
        sb
          .from("videos")
          .select("*")
          .order(
            "created_at",
            {
              ascending:
                false
            }
          );


      if (search) {

        query =
          query.ilike(
            "title",
            "%" +
              search +
              "%"
          );

      }


      const {
        data,
        error
      } =
        await query;


      const list =
        $("list");


      console.log(
        "VIDEOS:",
        data
      );


      console.log(
        "VIDEO ERROR:",
        error
      );


      /*
        DATABASE ERROR
      */

      if (error) {

        list.innerHTML = `

          <div class="empty">

            <div class="big">
              ⚠️
            </div>

            <h2>
              Błąd ładowania filmów
            </h2>

            <p class="muted">
              ${esc(
                error.message
              )}
            </p>

          </div>

        `;

        return;

      }


      /*
        NO VIDEOS
      */

      if (
        !data ||
        data.length === 0
      ) {

        list.innerHTML = `

          <div class="empty">

            <div class="big">
              🎬
            </div>

            <h2>
              Nie ma jeszcze żadnych filmów
            </h2>

            <p class="muted">

              Zaloguj się
              i wrzuć pierwszy film.

            </p>

          </div>

        `;

        return;

      }


      /*
        VIDEO GRID
      */

      list.innerHTML = `

        <div class="grid">

          ${data
            .map(
              function (videoData) {


                /*
                  VIDEO URL
                */

                const videoUrl =
                  sb.storage
                    .from("videos")
                    .getPublicUrl(
                      videoData.video_path
                    )
                    .data
                    .publicUrl;


                /*
                  THUMBNAIL URL
                */

                let thumbnailUrl =
                  "";


                if (
                  videoData.thumbnail_path
                ) {

                  thumbnailUrl =
                    sb.storage
                      .from(
                        "thumbnails"
                      )
                      .getPublicUrl(
                        videoData.thumbnail_path
                      )
                      .data
                      .publicUrl;

                }


                /*
                  CARD
                */

                return `

                  <article
                    class="card"
                  >

                    <video
                      class="thumb"
                      src="${videoUrl}"

                      ${
                        thumbnailUrl
                          ? `
                            poster="${thumbnailUrl}"
                          `
                          : ""
                      }

                      controls

                      preload="metadata"

                    ></video>


                    <div
                      class="info"
                    >

                      <div
                        class="title"
                      >
                        ${esc(
                          videoData.title
                        )}
                      </div>


                      <div
                        class="meta"
                      >
                        SillyTube
                      </div>

                    </div>

                  </article>

                `;

              }
            )
            .join("")}

        </div>

      `;

    }


    /* ========================= */
    /* ESCAPE HTML */
    /* ========================= */


    function esc(value) {

      return String(value)

        .replace(
          /[&<>"']/g,

          function (
            character
          ) {

            const replacements = {

              "&":
                "&amp;",

              "<":
                "&lt;",

              ">":
                "&gt;",

              '"':
                "&quot;",

              "'":
                "&#039;"

            };


            return replacements[
              character
            ];

          }
        );

    }


    /* ========================= */
    /* SEARCH */
    /* ========================= */


    $("search")
      .addEventListener(
        "input",
        function () {

          loadVideos();

        }
      );


    /* ========================= */
    /* START */
    /* ========================= */

    window.addEventListener(
      "DOMContentLoaded",
      function () {

        init();

      }
    );


  </script>


</body>

</html>
