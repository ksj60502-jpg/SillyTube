<script>

let currentUser = null;
let authMode = "login";
let myChannel = null;


/* ========================= */
/* HELPERS */
/* ========================= */

function $(id) {
  return document.getElementById(id);
}


function openModal(id) {
  $(id).classList.add("open");
}


function closeModal(id) {
  $(id).classList.remove("open");
}


function msg(element, text, success = false) {

  element.style.display = "block";

  element.textContent = text;

  element.style.color =
    success
      ? "#5ee68a"
      : "#ff8a8a";
}


function esc(value) {

  return String(value ?? "")
    .replace(
      /[&<>"']/g,
      function(character) {

        const map = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        };

        return map[character];

      }
    );

}


function visitorId() {

  let id =
    localStorage.getItem(
      "sillytube_visitor"
    );

  if (!id) {

    id =
      crypto.randomUUID();

    localStorage.setItem(
      "sillytube_visitor",
      id
    );

  }

  return id;

}


/* ========================= */
/* INIT */
/* ========================= */

async function init() {

  const result =
    await sb.auth.getSession();

  currentUser =
    result.data?.session?.user ||
    null;

  renderAccount();

  await loadVideos();

  sb.auth.onAuthStateChange(
    async function(event, session) {

      currentUser =
        session?.user ||
        null;

      renderAccount();

      if (currentUser) {
        await ensureProfile();
        await ensureChannel();
        await renderChannel();
      } else {
        $("channelPanel").innerHTML = "";
      }

      await loadVideos();

    }
  );

}


/* ========================= */
/* ACCOUNT */
/* ========================= */

function renderAccount() {

  const account =
    $("account");

  if (!currentUser) {

    account.innerHTML = `

      <button
        class="btn gray"
        id="loginBtn"
      >
        Zaloguj się
      </button>

    `;

    $("loginBtn").onclick =
      openAuth;

    return;

  }

  account.innerHTML = `

    <div class="userbox">

      <span
        class="balance"
        id="bal"
      >
        🪙 ...
      </span>

      <button
        class="btn gray"
        id="logout"
      >
        Wyloguj
      </button>

    </div>

  `;

  $("logout").onclick =
    async function() {

      await sb.auth.signOut();

    };

  loadBalance();

}


function openAuth() {
  openModal("authModal");
}


/* ========================= */
/* AUTH */
/* ========================= */

$("authAction").onclick =
  async function() {

    const email =
      $("authEmail")
        .value
        .trim();

    const password =
      $("authPass")
        .value;

    const status =
      $("authStatus");

    if (
      !email ||
      password.length < 6
    ) {

      msg(
        status,
        "Podaj e-mail i hasło minimum 6 znaków."
      );

      return;

    }

    $("authAction").disabled =
      true;

    let result;

    if (
      authMode === "login"
    ) {

      result =
        await sb.auth.signInWithPassword({
          email,
          password
        });

    } else {

      result =
        await sb.auth.signUp({

          email,
          password,

          options: {

            emailRedirectTo:
              "https://sillytube.ksj60502.workers.dev"

          }

        });

    }

    $("authAction").disabled =
      false;

    if (result.error) {

      msg(
        status,
        result.error.message
      );

      return;

    }

    if (
      authMode === "signup"
    ) {

      if (
        result.data?.session
      ) {

        currentUser =
          result.data.session.user;

        renderAccount();

        await ensureProfile();
        await ensureChannel();

        closeModal(
          "authModal"
        );

        await loadVideos();

      } else {

        msg(
          status,
          "Konto utworzone. Sprawdź e-mail i potwierdź konto.",
          true
        );

      }

    } else {

      currentUser =
        result.data?.user ||
        null;

      renderAccount();

      await ensureProfile();
      await ensureChannel();

      closeModal(
        "authModal"
      );

      await loadVideos();

    }

  };


$("switchAuth").onclick =
  function() {

    authMode =
      authMode === "login"
        ? "signup"
        : "login";

    $("authTitle")
      .textContent =
      authMode === "login"
        ? "Zaloguj się"
        : "Załóż konto";

    $("authAction")
      .textContent =
      authMode === "login"
        ? "Zaloguj"
        : "Zarejestruj";

    $("authSwitch")
      .firstChild
      .textContent =
      authMode === "login"
        ? "Nie masz konta? "
        : "Masz już konto? ";

  };


/* ========================= */
/* PROFILE */
/* ========================= */

async function ensureProfile() {

  if (!currentUser) {
    return;
  }

  const existing =
    await sb
      .from("profiles")
      .select("id")
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();

  if (existing.data) {
    return;
  }

  const username =
    (
      currentUser.email
        ?.split("@")[0] ||
      "user"
    ) +
    "-" +
    Math.floor(
      Math.random() * 10000
    );

  const result =
    await sb
      .from("profiles")
      .insert({

        id:
          currentUser.id,

        username:
          username,

        psc_balance:
          10000

      });

  if (result.error) {

    console.error(
      "PROFILE:",
      result.error
    );

  }

}


/* ========================= */
/* CHANNEL */
/* ========================= */

async function ensureChannel() {

  if (!currentUser) {
    return null;
  }

  let result =
    await sb
      .from("channels")
      .select("*")
      .eq(
        "owner_id",
        currentUser.id
      )
      .limit(1)
      .maybeSingle();

  if (result.data) {

    myChannel =
      result.data;

    return result.data;

  }

  result =
    await sb
      .from("channels")
      .insert({

        owner_id:
          currentUser.id,

        name:
          "Mój kanał",

        description:
          "Witaj na moim kanale!"

      })
      .select()
      .single();

  if (result.error) {

    console.error(
      "CHANNEL:",
      result.error
    );

    return null;

  }

  myChannel =
    result.data;

  return result.data;

}


/* ========================= */
/* BALANCE */
/* ========================= */

async function loadBalance() {

  if (!currentUser) {
    return;
  }

  const result =
    await sb
      .from("profiles")
      .select(
        "psc_balance"
      )
      .eq(
        "id",
        currentUser.id
      )
      .maybeSingle();

  if (
    result.data &&
    $("bal")
  ) {

    $("bal")
      .textContent =
      "🪙 " +
      Number(
        result.data.psc_balance ||
        0
      ).toFixed(2) +
      " zł";

  }

}


/* ========================= */
/* UPLOAD */
/* ========================= */

$("uploadBtn").onclick =
  async function() {

    if (!currentUser) {

      openAuth();

      return;

    }

    await ensureProfile();
    await ensureChannel();

    openModal(
      "uploadModal"
    );

  };


$("publish").onclick =
  async function() {

    if (!currentUser) {

      openAuth();

      return;

    }

    const title =
      $("videoTitle")
        .value
        .trim();

    const description =
      $("videoDescription")
        .value
        .trim();

    const videoFile =
      $("videoFile")
        .files[0];

    const thumbnailFile =
      $("thumbFile")
        .files[0];

    const status =
      $("uploadStatus");

    if (
      !title ||
      !videoFile
    ) {

      msg(
        status,
        "Podaj tytuł i wybierz film."
      );

      return;

    }

    if (
      videoFile.size >
      500 * 1024 * 1024
    ) {

      msg(
        status,
        "Film może mieć maksymalnie 500 MB."
      );

      return;

    }

    try {

      msg(
        status,
        "Wysyłanie filmu..."
      );

      const safe =
        (
          videoFile.name ||
          "video"
        ).replace(
          /[^a-zA-Z0-9._-]/g,
          "_"
        );

      const videoPath =
        currentUser.id +
        "/" +
        Date.now() +
        "-" +
        safe;

      let result =
        await sb.storage
          .from("videos")
          .upload(
            videoPath,
            videoFile,
            {
              upsert: false,
              contentType:
                videoFile.type
            }
          );

      if (result.error) {
        throw new Error(
          result.error.message
        );
      }

      let thumbnailPath =
        null;

      if (thumbnailFile) {

        const thumbName =
          (
            thumbnailFile.name ||
            "thumbnail"
          ).replace(
            /[^a-zA-Z0-9._-]/g,
            "_"
          );

        thumbnailPath =
          currentUser.id +
          "/" +
          Date.now() +
          "-" +
          thumbName;

        result =
          await sb.storage
            .from("thumbnails")
            .upload(
              thumbnailPath,
              thumbnailFile,
              {
                upsert: false,
                contentType:
                  thumbnailFile.type
              }
            );

        if (result.error) {

          await sb.storage
            .from("videos")
            .remove([
              videoPath
            ]);

          throw new Error(
            result.error.message
          );

        }

      }

      const channel =
        await ensureChannel();

      if (!channel) {

        throw new Error(
          "Nie znaleziono kanału."
        );

      }

      result =
        await sb
          .from("videos")
          .insert({

            owner_id:
              currentUser.id,

            channel_id:
              channel.id,

            title:
              title,

            description:
              description,

            video_path:
              videoPath,

            thumbnail_path:
              thumbnailPath,

            views:
              0,

            likes_count:
              0

          });

      if (result.error) {

        await sb.storage
          .from("videos")
          .remove([
            videoPath
          ]);

        if (thumbnailPath) {

          await sb.storage
            .from("thumbnails")
            .remove([
              thumbnailPath
            ]);

        }

        throw new Error(
          result.error.message
        );

      }

      msg(
        status,
        "Film opublikowany!",
        true
      );

      $("videoTitle").value = "";
      $("videoDescription").value = "";
      $("videoFile").value = "";
      $("thumbFile").value = "";

      setTimeout(
        async function() {

          closeModal(
            "uploadModal"
          );

          await loadVideos();

        },
        700
      );

    } catch (error) {

      console.error(
        "UPLOAD:",
        error
      );

      msg(
        status,
        error.message
      );

    }

  };


/* ========================= */
/* LOAD VIDEOS */
/* ========================= */

async function loadVideos() {

  const search =
    $("search")
      .value
      .trim();

  let query =
    sb
      .from("videos")
      .select("*")
      .order(
        "created_at",
        {
          ascending:
            false
        }
      );

  if (search) {

    query =
      query.ilike(
        "title",
        "%" +
        search +
        "%"
      );

  }

  const {
    data,
    error
  } =
    await query;

  const list =
    $("list");

  console.log(
    "VIDEOS:",
    data
  );

  console.log(
    "VIDEO ERROR:",
    error
  );

  if (error) {

    list.innerHTML = `

      <div class="empty">

        <div class="big">
          ⚠️
        </div>

        <h2>
          Błąd
        </h2>

        <p class="muted">
          ${esc(error.message)}
        </p>

      </div>

    `;

    return;

  }

  if (
    !data ||
    data.length === 0
  ) {

    list.innerHTML = `

      <div class="empty">

        <div class="big">
          🎬
        </div>

        <h2>
          Nie ma jeszcze filmów
        </h2>

        <p class="muted">
          Dodaj pierwszy film!
        </p>

      </div>

    `;

    return;

  }


  /* ========================= */
  /* POBIERAMY WSZYSTKIE LIKE */
  /* ========================= */

  const videoIds =
    data.map(
      video =>
        video.id
    );


  const likeCounts = {};


  let likedIds =
    new Set();


  const likesResult =
    await sb
      .from("video_likes")
      .select(
        "video_id,visitor_id"
      )
      .in(
        "video_id",
        videoIds
      );


  console.log(
    "LIKES:",
    likesResult.data
  );


  if (
    likesResult.data
  ) {

    likesResult.data.forEach(
      function(like) {

        if (
          !likeCounts[
            like.video_id
          ]
        ) {

          likeCounts[
            like.video_id
          ] = 0;

        }

        likeCounts[
          like.video_id
        ]++;


        if (
          like.visitor_id ===
          visitorId()
        ) {

          likedIds.add(
            like.video_id
          );

        }

      }
    );

  }


  /* ========================= */
  /* RENDER */
  /* ========================= */

  list.innerHTML = `

    <div class="grid">

      ${data.map(
        function(videoData) {

          const videoUrl =
            sb.storage
              .from("videos")
              .getPublicUrl(
                videoData.video_path
              )
              .data
              .publicUrl;


          let thumbUrl = "";


          if (
            videoData.thumbnail_path
          ) {

            thumbUrl =
              sb.storage
                .from("thumbnails")
                .getPublicUrl(
                  videoData.thumbnail_path
                )
                .data
                .publicUrl;

          }


          const liked =
            likedIds.has(
              videoData.id
            );


          const likes =
            likeCounts[
              videoData.id
            ] || 0;


          return `

            <article
              class="card"
            >

              <video
                class="thumb"
                src="${esc(videoUrl)}"

                ${
                  thumbUrl
                    ? `poster="${esc(thumbUrl)}"`
                    : ""
                }

                controls
                preload="metadata"

                onclick="
                  countView(
                    '${videoData.id}'
                  )
                "

              ></video>


              <div class="info">

                <div class="title">
                  ${esc(
                    videoData.title
                  )}
                </div>


                ${
                  videoData.description
                    ? `

                      <div
                        class="description"
                      >
                        ${esc(
                          videoData.description
                        )}
                      </div>

                    `
                    : ""
                }


                <div class="meta">

                  👁️
                  ${Number(
                    videoData.views ||
                    0
                  )}

                  &nbsp; · &nbsp;

                  ❤️
                  ${likes}

                </div>


                <div class="actions">

                  <button
                    class="
                      action-btn
                      ${
                        liked
                          ? "active"
                          : ""
                      }
                    "

                    onclick="
                      likeVideo(
                        '${videoData.id}'
                      )
                    "
                  >

                    ${
                      liked
                        ? "❤️"
                        : "👍"
                    }

                    ${
                      liked
                        ? "Polubiono"
                        : "Lubię to"
                    }

                    · ${likes}

                  </button>


                  <button
                    class="action-btn"

                    onclick="
                      subscribeChannel(
                        '${videoData.channel_id}'
                      )
                    "
                  >

                    🔔 Subskrybuj

                  </button>

                </div>

              </div>

            </article>

          `;

        }
      ).join("")}

    </div>

  `;

}

async function likeVideo(
  videoId
) {

  const visitor =
    visitorId();


  console.log(
    "LIKE:",
    videoId,
    visitor
  );


  const existing =
    await sb
      .from("video_likes")
      .select("id")
      .eq(
        "video_id",
        videoId
      )
      .eq(
        "visitor_id",
        visitor
      )
      .maybeSingle();


  if (existing.error) {

    console.error(
      "LIKE CHECK:",
      existing.error
    );

    alert(
      existing.error.message
    );

    return;

  }


  if (
    existing.data
  ) {

    const result =
      await sb
        .from("video_likes")
        .delete()
        .eq(
          "id",
          existing.data.id
        );


    if (result.error) {

      console.error(
        "LIKE DELETE:",
        result.error
      );

      alert(
        result.error.message
      );

      return;

    }

  } else {

    const result =
      await sb
        .from("video_likes")
        .insert({

          video_id:
            videoId,

          visitor_id:
            visitor

        });


    if (result.error) {

      console.error(
        "LIKE INSERT:",
        result.error
      );

      alert(
        result.error.message
      );

      return;

    }

  }


  await loadVideos();

}


/* ========================= */
/* VIEWS */
/* ========================= */

async function countView(
  videoId
) {

  const key =
    "viewed_" +
    videoId;


  if (
    sessionStorage.getItem(
      key
    )
  ) {

    return;

  }


  sessionStorage.setItem(
    key,
    "1"
  );


  const result =
    await sb
      .from("videos")
      .select("views")
      .eq(
        "id",
        videoId
      )
      .single();


  if (
    result.data
  ) {

    await sb
      .from("videos")
      .update({

        views:
          Number(
            result.data.views ||
            0
          ) + 1

      })
      .eq(
        "id",
        videoId
      );

  }

}

async function subscribeChannel(
  channelId
) {

  if (!currentUser) {

    openAuth();

    return;

  }


  if (
    channelId ===
    myChannel?.id
  ) {

    alert(
      "Nie możesz subskrybować własnego kanału."
    );

    return;

  }


  const existing =
    await sb
      .from("subscriptions")
      .select("id")
      .eq(
        "subscriber_id",
        currentUser.id
      )
      .eq(
        "channel_id",
        channelId
      )
      .maybeSingle();


  if (
    existing.data
  ) {

    const result =
      await sb
        .from("subscriptions")
        .delete()
        .eq(
          "id",
          existing.data.id
        );


    if (result.error) {

      alert(
        result.error.message
      );

      return;

    }


    alert(
      "Subskrypcja anulowana."
    );

  } else {

    const result =
      await sb
        .from("subscriptions")
        .insert({

          subscriber_id:
            currentUser.id,

          channel_id:
            channelId

        });


    if (result.error) {

      alert(
        result.error.message
      );

      return;

    }


    alert(
      "Subskrypcja dodana!"
    );

  }

}

async function joinMembership(
  membershipId
) {

  if (!currentUser) {

    openAuth();

    return;

  }


  const membership =
    await sb
      .from("channel_memberships")
      .select("*")
      .eq(
        "id",
        membershipId
      )
      .single();


  if (
    membership.error ||
    !membership.data
  ) {

    alert(
      "Nie znaleziono membershipu."
    );

    return;

  }


  const price =
    Number(
      membership.data.price ||
      0
    );


  const profile =
    await sb
      .from("profiles")
      .select(
        "psc_balance"
      )
      .eq(
        "id",
        currentUser.id
      )
      .single();


  if (
    profile.error ||
    !profile.data
  ) {

    alert(
      "Nie znaleziono profilu."
    );

    return;

  }


  const balance =
    Number(
      profile.data.psc_balance ||
      0
    );


  if (
    balance < price
  ) {

    alert(
      "Masz za mało wirtualnego salda."
    );

    return;

  }


  const result =
    await sb
      .from("channel_members")
      .insert({

        membership_id:
          membershipId,

        user_id:
          currentUser.id

      });


  if (result.error) {

    alert(
      result.error.message
    );

    return;

  }


  await sb
    .from("profiles")
    .update({

      psc_balance:
        balance - price

    })
    .eq(
      "id",
      currentUser.id
    );


  alert(
    "Dołączyłeś do membershipu!"
  );


  await loadBalance();

}
