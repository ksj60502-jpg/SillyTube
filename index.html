<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>SillyTube</title>

  <script type="module">
    import { createClient }
      from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    window.sb = createClient(
      "https://czyklqosqoqxgaxoejpz.supabase.co",
      "sb_publishable_xChRH3i5kMb0ErQALcXKHA_Gogcykzj"
    );
  </script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0f0f0f;
      color: white;
      font-family: Arial, sans-serif;
    }

    header {
      height: 64px;
      background: #181818;
      border-bottom: 1px solid #292929;
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 0 22px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      font-size: 23px;
      font-weight: 800;
      white-space: nowrap;
    }

    .logo span {
      background: #f03;
      padding: 7px 10px;
      border-radius: 9px;
      margin-right: 7px;
    }

    .search {
      flex: 1;
      max-width: 620px;
      margin: auto;
    }

    .search input {
      width: 100%;
      background: #101010;
      color: white;
      border: 1px solid #444;
      border-radius: 24px;
      padding: 11px 16px;
      outline: none;
    }

    button {
      font-family: inherit;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .red {
      background: #f03;
      color: white;
    }

    .gray {
      background: #303030;
      color: white;
    }

    .main {
      max-width: 1250px;
      margin: auto;
      padding: 25px 20px;
    }

    .hero {
      background: linear-gradient(120deg, #25102a, #121c35);
      border: 1px solid #303030;
      border-radius: 18px;
      padding: 26px;
      margin-bottom: 25px;
    }

    .hero h1 {
      margin: 0 0 8px;
      font-size: 34px;
    }

    .muted {
      color: #999;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fill,
        minmax(250px, 1fr)
      );
      gap: 20px;
    }

    .card {
      background: #181818;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #242424;
    }

    .thumb {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #292929;
    }

    .info {
      padding: 13px;
    }

    .title {
      font-weight: 700;
      font-size: 16px;
      line-height: 1.3;
    }

    .description {
      color: #bbb;
      margin-top: 8px;
      line-height: 1.4;
      word-break: break-word;
    }

    .meta {
      color: #999;
      font-size: 13px;
      margin-top: 8px;
    }

    .actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .small-btn {
      padding: 7px 10px;
      border-radius: 8px;
      border: 0;
      background: #303030;
      color: white;
      cursor: pointer;
      font-weight: 700;
    }

    .small-btn:hover,
    .btn:hover {
      filter: brightness(1.15);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: #000c;
      z-index: 20;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }

    .modal.open {
      display: flex;
    }

    .box {
      width: min(600px, 100%);
      background: #181818;
      border: 1px solid #444;
      border-radius: 18px;
      padding: 24px;
      max-height: 90vh;
      overflow: auto;
    }

    .box h2 {
      margin-top: 0;
    }

    .box input,
    .box textarea {
      width: 100%;
      padding: 11px;
      margin: 7px 0 14px;
      background: #101010;
      color: white;
      border: 1px solid #444;
      border-radius: 9px;
      font-family: Arial, sans-serif;
    }

    .box textarea {
      min-height: 120px;
      resize: vertical;
    }

    .row {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .status {
      padding: 12px;
      border-radius: 10px;
      background: #222;
      margin: 10px 0;
      display: none;
      white-space: pre-wrap;
    }

    .empty {
      text-align: center;
      padding: 65px 20px;
      border: 1px dashed #444;
      border-radius: 18px;
      background: #141414;
    }

    .empty .big {
      font-size: 55px;
    }

    .userbox {
      display: flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .profile {
      text-align: center;
    }

    .avatar {
      width: 90px;
      height: 90px;
      margin: 0 auto 15px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f03, #742cff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      font-weight: 800;
    }

    .subscriber-count {
      font-size: 18px;
      font-weight: 800;
      margin: 15px 0 22px;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #999;
    }

    @media(max-width:700px) {
      header {
        padding: 0 10px;
        gap: 8px;
      }

      .logo {
        font-size: 17px;
      }

      .search {
        display: none;
      }

      .main {
        padding: 16px 12px;
      }

      .hero h1 {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    <span>▶</span>SillyTube
  </div>

  <div class="search">
    <input
      id="search"
      placeholder="Szukaj filmów..."
      autocomplete="off"
    >
  </div>

  <div id="account">
    <button class="btn gray" id="loginBtn">
      Zaloguj się
    </button>
  </div>

</header>

<main class="main">

  <section class="hero">

    <h1>SillyTube 🎬</h1>

    <p>
      Darmowa platforma wideo.
    </p>

    <p class="muted">
      Oglądaj i publikuj własne filmy.
    </p>

    <button
      class="btn red"
      id="uploadBtn"
    >
      ⬆ Upload filmu
    </button>

    <button
      class="btn gray"
      id="profileBtn"
      style="display:none"
    >
      👤 Mój profil
    </button>

  </section>

  <div id="list">
    <div class="loading">
      Ładowanie filmów...
    </div>
  </div>

</main>


<!-- =========================
     LOGOWANIE
========================= -->

<div class="modal" id="authModal">

  <div class="box">

    <h2 id="authTitle">
      Zaloguj się
    </h2>

    <input
      id="authEmail"
      type="email"
      placeholder="E-mail"
      autocomplete="email"
    >

    <input
      id="authPass"
      type="password"
      placeholder="Hasło"
      autocomplete="current-password"
    >

    <div class="row">

      <button
        class="btn gray"
        onclick="closeModal('authModal')"
      >
        Anuluj
      </button>

      <button
        class="btn red"
        id="authAction"
      >
        Zaloguj
      </button>

    </div>

    <p class="muted" id="authSwitch">
      Nie masz konta?

      <button
        class="btn gray"
        id="switchAuth"
      >
        Załóż konto
      </button>
    </p>

    <div
      class="status"
      id="authStatus"
    ></div>

  </div>

</div>


<!-- =========================
     UPLOAD
========================= -->

<div class="modal" id="uploadModal">

  <div class="box">

    <h2>
      Upload filmu
    </h2>

    <input
      id="videoTitle"
      placeholder="Tytuł filmu"
      maxlength="200"
    >

    <textarea
      id="videoDescription"
      placeholder="Opis filmu..."
      maxlength="5000"
    ></textarea>

    <label class="muted">
      Film
    </label>

    <input
      id="videoFile"
      type="file"
      accept="video/*"
    >

    <div
      id="videoFileInfo"
      class="muted"
    ></div>

    <br>

    <label class="muted">
      Miniaturka
    </label>

    <input
      id="thumbFile"
      type="file"
      accept="image/jpeg,image/png,image/gif,image/webp"
    >

    <div
      class="status"
      id="uploadStatus"
    ></div>

    <div class="row">

      <button
        class="btn gray"
        onclick="closeModal('uploadModal')"
      >
        Anuluj
      </button>

      <button
        class="btn red"
        id="publish"
      >
        Opublikuj
      </button>

    </div>

  </div>

</div>


<!-- =========================
     PROFIL
========================= -->

<div class="modal" id="profileModal">

  <div class="box profile">

    <h2>
      Mój profil
    </h2>

    <div
      class="avatar"
      id="profileAvatar"
    >
      👤
    </div>

    <h2 id="profileName">
      Użytkownik
    </h2>

    <div
      class="subscriber-count"
      id="subscriberCount"
    >
      0 subskrybentów
    </div>

    <p
      class="muted"
      id="profileEmail"
    ></p>

    <div class="row">

      <button
        class="btn gray"
        onclick="closeModal('profileModal')"
      >
        Zamknij
      </button>

    </div>

  </div>

</div>


<script>

  let currentUser = null;
  let authMode = "login";
  let searchTimer = null;


  /* =========================
     HELPERY
  ========================= */

  const $ = id =>
    document.getElementById(id);


  function openModal(id) {
    $(id).classList.add("open");
  }


  function closeModal(id) {
    $(id).classList.remove("open");
  }


  function msg(el, text, ok = false) {

    el.style.display = "block";
    el.textContent = text;
    el.style.color = ok
      ? "#5ee68a"
      : "#ff8a8a";
  }


  function esc(value) {

    return String(value ?? "")
      .replace(
        /[&<>"']/g,
        function(m) {

          return {
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#039;"
          }[m];

        }
      );

  }


  function getInitial(name) {

    const text =
      String(name || "U")
        .trim();

    return text
      ? text.charAt(0).toUpperCase()
      : "U";

  }


  /* =========================
     AUTH
  ========================= */

  async function init() {

    try {

      const result =
        await sb.auth.getSession();

      currentUser =
        result.data?.session?.user || null;

      renderAccount();
      await loadVideos();

      sb.auth.onAuthStateChange(
        function(_event, session) {

          currentUser =
            session?.user || null;

          renderAccount();

          loadVideos();

        }
      );

    } catch (error) {

      console.error(error);

      $("list").innerHTML = `
        <div class="empty">
          <div class="big">⚠️</div>
          <h2>Błąd uruchamiania</h2>
          <p class="muted">
            ${esc(error.message)}
          </p>
        </div>
      `;

    }

  }


  function renderAccount() {

    const account = $("account");
    const profileBtn = $("profileBtn");

    if (!currentUser) {

      account.innerHTML = `
        <button
          class="btn gray"
          id="loginBtn"
        >
          Zaloguj się
        </button>
      `;

      $("loginBtn").onclick =
        openAuth;

      profileBtn.style.display =
        "none";

      return;
    }


    account.innerHTML = `
      <div class="userbox">

        <button
          class="btn gray"
          id="accountProfile"
        >
          👤 Profil
        </button>

        <button
          class="btn gray"
          id="logout"
        >
          Wyloguj
        </button>

      </div>
    `;


    $("accountProfile").onclick =
      showMyProfile;


    $("logout").onclick =
      async function() {

        await sb.auth.signOut();

      };


    profileBtn.style.display =
      "inline-block";

  }


  function openAuth() {

    openModal("authModal");

  }


  $("authAction").onclick =
    async function() {

      const email =
        $("authEmail")
          .value
          .trim();

      const password =
        $("authPass")
          .value;

      const status =
        $("authStatus");


      if (
        !email ||
        password.length < 6
      ) {

        msg(
          status,
          "Podaj e-mail i hasło. Hasło musi mieć minimum 6 znaków."
        );

        return;

      }


      $("authAction").disabled =
        true;


      let result;


      try {

        if (authMode === "login") {

          result =
            await sb.auth.signInWithPassword({
              email,
              password
            });

        } else {

          result =
            await sb.auth.signUp({
              email,
              password
            });

        }


        if (result.error) {

          msg(
            status,
            result.error.message
          );

          return;

        }


        if (authMode === "signup") {

          if (result.data?.session) {

            msg(
              status,
              "Konto utworzone i zalogowano.",
              true
            );

            setTimeout(
              () => closeModal("authModal"),
              700
            );

          } else {

            msg(
              status,
              "Konto utworzone. Sprawdź e-mail, aby potwierdzić konto.",
              true
            );

          }

        } else {

          closeModal("authModal");

        }

      } finally {

        $("authAction").disabled =
          false;

      }

    };


  $("switchAuth").onclick =
    function() {

      authMode =
        authMode === "login"
          ? "signup"
          : "login";


      $("authTitle").textContent =
        authMode === "login"
          ? "Zaloguj się"
          : "Załóż konto";


      $("authAction").textContent =
        authMode === "login"
          ? "Zaloguj"
          : "Zarejestruj";


      $("authSwitch").firstChild
        .textContent =
          authMode === "login"
            ? "Nie masz konta? "
            : "Masz już konto? ";

    };


  /* =========================
     CHANNEL
  ========================= */

  async function getExistingChannel() {

    if (!currentUser) {
      throw new Error(
        "Musisz być zalogowany."
      );
    }


    const result =
      await sb
        .from("channels")
        .select(
          "id,name,owner_id"
        )
        .eq(
          "owner_id",
          currentUser.id
        )
        .limit(1);


    if (result.error) {

      throw new Error(
        result.error.message
      );

    }


    return result.data?.[0] || null;

  }


  async function getOrCreateChannel() {

    const existing =
      await getExistingChannel();


    if (existing) {

      return existing;

    }


    /*
      WAŻNE:

      Najpierw sprawdzamy profil.

      owner_id w channels musi wskazywać
      istniejący rekord profiles.
    */

    const profile =
      await sb
        .from("profiles")
        .select("id,username")
        .eq(
          "id",
          currentUser.id
        )
        .maybeSingle();


    if (profile.error) {

      throw new Error(
        "Nie można sprawdzić profilu: " +
        profile.error.message
      );

    }


    if (!profile.data) {

      throw new Error(
        "Twoje konto nie ma jeszcze profilu w tabeli profiles. Utwórz profil w Supabase przed uploadem."
      );

    }


    const username =
      profile.data.username ||
      currentUser.user_metadata?.username ||
      currentUser.email?.split("@")[0] ||
      "Użytkownik";


    const result =
      await sb
        .from("channels")
        .insert({

          owner_id:
            currentUser.id,

          name:
            username + " - kanał",

          description:
            "Kanał SillyTube"

        })
        .select(
          "id,name,owner_id"
        )
        .single();


    if (result.error) {

      throw new Error(
        "Nie udało się utworzyć kanału: " +
        result.error.message
      );

    }


    return result.data;

  }


  /* =========================
     UPLOAD
  ========================= */

  $("uploadBtn").onclick =
    function() {

      if (!currentUser) {

        openAuth();

        return;

      }

      openModal("uploadModal");

    };


  $("videoFile").addEventListener(
    "change",
    function() {

      const file =
        $("videoFile").files[0];


      if (!file) {

        $("videoFileInfo")
          .textContent = "";

        return;

      }


      $("videoFileInfo")
        .textContent =
          "Wybrano: " +
          file.name +
          " (" +
          (
            file.size /
            1024 /
            1024
          ).toFixed(1) +
          " MB)";

    }
  );


  $("publish").onclick =
    async function() {

      const title =
        $("videoTitle")
          .value
          .trim();


      const description =
        $("videoDescription")
          .value
          .trim();


      const videoFile =
        $("videoFile")
          .files[0];


      const thumbFile =
        $("thumbFile")
          .files[0];


      const status =
        $("uploadStatus");


      if (!currentUser) {

        msg(
          status,
          "Musisz być zalogowany."
        );

        return;

      }


      if (!title) {

        msg(
          status,
          "Podaj tytuł filmu."
        );

        return;

      }


      if (!videoFile) {

        msg(
          status,
          "Wybierz film."
        );

        return;

      }


      if (
        videoFile.size >
        500 * 1024 * 1024
      ) {

        msg(
          status,
          "Film jest większy niż 500 MB."
        );

        return;

      }


      const publish =
        $("publish");

      publish.disabled = true;


      let videoPath = null;
      let thumbnailPath = null;


      try {

        msg(
          status,
          "Sprawdzanie kanału..."
        );


        const channel =
          await getOrCreateChannel();


        msg(
          status,
          "Wysyłanie filmu..."
        );


        const safeName =
          (
            videoFile.name ||
            "video"
          )
            .replace(
              /[^a-zA-Z0-9._-]/g,
              "_"
            );


        videoPath =
          currentUser.id +
          "/" +
          Date.now() +
          "-" +
          safeName;


        let result =
          await sb
            .storage
            .from("videos")
            .upload(
              videoPath,
              videoFile,
              {
                upsert: false,
                contentType:
                  videoFile.type ||
                  "video/mp4"
              }
            );


        if (result.error) {

          throw new Error(
            "Błąd uploadu filmu: " +
            result.error.message
          );

        }


        /* MINIATURKA */

        if (thumbFile) {

          const safeThumb =
            (
              thumbFile.name ||
              "thumbnail"
            )
              .replace(
                /[^a-zA-Z0-9._-]/g,
                "_"
              );


          thumbnailPath =
            currentUser.id +
            "/" +
            Date.now() +
            "-" +
            safeThumb;


          result =
            await sb
              .storage
              .from("thumbnails")
              .upload(
                thumbnailPath,
                thumbFile,
                {
                  upsert: false,
                  contentType:
                    thumbFile.type ||
                    "image/jpeg"
                }
              );


          if (result.error) {

            await sb
              .storage
              .from("videos")
              .remove([
                videoPath
              ]);

            throw new Error(
              "Błąd miniaturki: " +
              result.error.message
            );

          }

        }


        msg(
          status,
          "Zapisywanie filmu..."
        );


        result =
          await sb
            .from("videos")
            .insert({

              owner_id:
                currentUser.id,

              channel_id:
                channel.id,

              title:
                title,

              description:
                description,

              video_path:
                videoPath,

              thumbnail_path:
                thumbnailPath

            });


        if (result.error) {

          await sb
            .storage
            .from("videos")
            .remove([
              videoPath
            ]);


          if (thumbnailPath) {

            await sb
              .storage
              .from("thumbnails")
              .remove([
                thumbnailPath
              ]);

          }


          throw new Error(
            "Nie udało się zapisać filmu: " +
            result.error.message
          );

        }


        msg(
          status,
          "Film opublikowany! 🎉",
          true
        );


        setTimeout(
          async function() {

            closeModal(
              "uploadModal"
            );


            $("videoTitle")
              .value = "";

            $("videoDescription")
              .value = "";

            $("videoFile")
              .value = "";

            $("thumbFile")
              .value = "";

            $("videoFileInfo")
              .textContent = "";

            status.style.display =
              "none";


            await loadVideos();

          },
          800
        );


      } catch (error) {

        console.error(
          "UPLOAD ERROR:",
          error
        );


        msg(
          status,
          error.message ||
          "Nieznany błąd."
        );

      } finally {

        publish.disabled =
          false;

      }

    };


  /* =========================
     FILMY
  ========================= */

  async function loadVideos() {

    const list =
      $("list");


    const search =
      $("search")
        .value
        .trim();


    list.innerHTML = `
      <div class="loading">
        Ładowanie filmów...
      </div>
    `;


    try {

      /*
        Najważniejsza rzecz:

        Filmy pobieramy bez JOIN z channels.

        Dzięki temu nawet jeśli kanał ma problem,
        video nadal może pojawić się na stronie.
      */

      let query =
        sb
          .from("videos")
          .select(
            "id,owner_id,channel_id,title,description,video_path,thumbnail_path,created_at"
          )
          .order(
            "created_at",
            {
              ascending: false
            }
          );


      if (search) {

        query =
          query.ilike(
            "title",
            "%" +
            search +
            "%"
          );

      }


      const result =
        await query;


      console.log(
        "VIDEOS:",
        result.data
      );

      console.log(
        "VIDEO ERROR:",
        result.error
      );


      if (result.error) {

        throw result.error;

      }


      const videos =
        result.data || [];


      if (!videos.length) {

        list.innerHTML = `
          <div class="empty">

            <div class="big">
              🎬
            </div>

            <h2>
              ${
                search
                  ? "Nie znaleziono filmów"
                  : "Nie ma jeszcze żadnych filmów"
              }
            </h2>

            <p class="muted">
              ${
                search
                  ? "Spróbuj innej nazwy filmu."
                  : "Wrzuć pierwszy film na SillyTube."
              }
            </p>

          </div>
        `;

        return;

      }


      /*
        Kanały pobieramy osobno.

        Jeżeli kanał któregoś filmu nie istnieje,
        film nadal jest wyświetlany.
      */

      const channelIds =
        [
          ...new Set(
            videos
              .map(
                v => v.channel_id
              )
              .filter(Boolean)
          )
        ];


      let channels = [];


      if (channelIds.length) {

        const channelResult =
          await sb
            .from("channels")
            .select(
              "id,name"
            )
            .in(
              "id",
              channelIds
            );


        if (
          !channelResult.error
        ) {

          channels =
            channelResult.data || [];

        } else {

          console.warn(
            "CHANNEL LOAD ERROR:",
            channelResult.error
          );

        }

      }


      const channelMap = {};


      channels.forEach(
        channel => {

          channelMap[
            channel.id
          ] =
            channel.name;

        }
      );


      list.innerHTML = `
        <div class="grid">

          ${
            videos
              .map(
                video =>
                  renderVideo(
                    video,
                    channelMap
                  )
              )
              .join("")
          }

        </div>
      `;


    } catch (error) {

      console.error(
        "LOAD VIDEOS ERROR:",
        error
      );


      list.innerHTML = `
        <div class="empty">

          <div class="big">
            ⚠️
          </div>

          <h2>
            Błąd ładowania filmów
          </h2>

          <p class="muted">
            ${esc(error.message)}
          </p>

          <button
            class="btn red"
            onclick="loadVideos()"
          >
            Spróbuj ponownie
          </button>

        </div>
      `;

    }

  }


  function renderVideo(
    video,
    channelMap
  ) {

    const videoUrl =
      sb
        .storage
        .from("videos")
        .getPublicUrl(
          video.video_path
        )
        .data
        .publicUrl;


    let thumbnailUrl = "";


    if (
      video.thumbnail_path
    ) {

      thumbnailUrl =
        sb
          .storage
          .from("thumbnails")
          .getPublicUrl(
            video.thumbnail_path
          )
          .data
          .publicUrl;

    }


    const channelName =
      channelMap[
        video.channel_id
      ] ||
      "SillyTube";


    const date =
      video.created_at
        ? new Date(
            video.created_at
          ).toLocaleDateString(
            "pl-PL"
          )
        : "";


    return `
      <article class="card">

        <video
          class="thumb"
          src="${esc(videoUrl)}"
          ${
            thumbnailUrl
              ? `poster="${esc(thumbnailUrl)}"`
              : ""
          }
          controls
          preload="metadata"
        ></video>

        <div class="info">

          <div class="title">
            ${esc(video.title)}
          </div>

          ${
            video.description
              ? `
                <div class="description">
                  ${esc(
                    video.description
                  )}
                </div>
              `
              : ""
          }

          <div class="meta">
            ${esc(channelName)}
            ${date ? " · " + esc(date) : ""}
          </div>

          <div class="actions">

            <button
              class="small-btn like-button"
              data-video-id="${esc(video.id)}"
            >
              👍 Lubię to
            </button>

            ${
              video.channel_id
                ? `
                  <button
                    class="small-btn"
                    onclick="subscribe('${esc(
                      video.channel_id
                    )}')"
                  >
                    🔔 Subskrybuj
                  </button>
                `
                : ""
            }

          </div>

        </div>

      </article>
    `;

  }


  /* =========================
     SEARCH
  ========================= */

  $("search").addEventListener(
    "input",
    function() {

      clearTimeout(
        searchTimer
      );


      searchTimer =
        setTimeout(
          loadVideos,
          250
        );

    }
  );


  /* =========================
     LIKE
  ========================= */

  async function likeVideo(
    videoId,
    button
  ) {

    let visitorId =
      localStorage.getItem(
        "sillytube_visitor_id"
      );


    if (!visitorId) {

      if (
        crypto &&
        crypto.randomUUID
      ) {

        visitorId =
          crypto.randomUUID();

      } else {

        visitorId =
          "visitor-" +
          Date.now() +
          "-" +
          Math.random()
            .toString(36)
            .slice(2);

      }


      localStorage.setItem(
        "sillytube_visitor_id",
        visitorId
      );

    }


    button.disabled = true;


    const result =
      await sb
        .from("video_likes")
        .insert({

          video_id:
            videoId,

          visitor_id:
            visitorId

        });


    if (result.error) {

      button.disabled = false;


      if (
        result.error.code ===
        "23505"
      ) {

        button.textContent =
          "👍 Polubiono";

      } else {

        console.error(
          "LIKE ERROR:",
          result.error
        );

        alert(
          "Błąd lajka: " +
          result.error.message
        );

      }

      return;

    }


    button.textContent =
      "👍 1 Like";


  }


  /*
    Delegacja kliknięć dla przycisków lajka.
    Dzięki temu działa również po ponownym
    załadowaniu listy filmów.
  */

  $("list").addEventListener(
    "click",
    function(event) {

      const button =
        event.target.closest(
          ".like-button"
        );


      if (!button)
        return;


      const videoId =
        button.dataset.videoId;


      if (!videoId)
        return;


      likeVideo(
        videoId,
        button
      );

    }
  );


  /* =========================
     SUBSKRYPCJA
  ========================= */

  async function subscribe(
    channelId
  ) {

    if (!currentUser) {

      openAuth();

      return;

    }


    if (!channelId) {

      alert(
        "Nie znaleziono kanału."
      );

      return;

    }


    /*
      Nie pozwalamy subskrybować
      samego siebie.
    */

    const channel =
      await sb
        .from("channels")
        .select(
          "owner_id"
        )
        .eq(
          "id",
          channelId
        )
        .maybeSingle();


    if (
      channel.data &&
      channel.data.owner_id ===
      currentUser.id
    ) {

      alert(
        "Nie możesz subskrybować własnego kanału."
      );

      return;

    }


    const result =
      await sb
        .from("subscriptions")
        .insert({

          subscriber_id:
            currentUser.id,

          channel_id:
            channelId

        });


    if (result.error) {

      console.error(
        "SUB ERROR:",
        result.error
      );


      if (
        result.error.code ===
        "23505"
      ) {

        alert(
          "Już subskrybujesz ten kanał 🔔"
        );

      } else {

        alert(
          "Błąd subskrypcji: " +
          result.error.message
        );

      }

      return;

    }


    alert(
      "Subskrypcja dodana! 🔔"
    );

  }


  /* =========================
     PROFIL
  ========================= */

  async function showMyProfile() {

    if (!currentUser) {

      openAuth();

      return;

    }


    /*
      UWAGA:
      Nie wywołujemy tutaj getOrCreateChannel().
      Samo wejście w profil nie powinno próbować
      tworzyć kanału.
    */

    const profileResult =
      await sb
        .from("profiles")
        .select(
          "id,username"
        )
        .eq(
          "id",
          currentUser.id
        )
        .maybeSingle();


    if (profileResult.error) {

      alert(
        "Nie udało się pobrać profilu: " +
        profileResult.error.message
      );

      return;

    }


    const username =
      profileResult.data?.username ||
      currentUser.user_metadata?.username ||
      currentUser.email?.split("@")[0] ||
      "Użytkownik";


    $("profileName")
      .textContent =
        username;


    $("profileAvatar")
      .textContent =
        getInitial(username);


    $("profileEmail")
      .textContent =
        currentUser.email || "";


    $("subscriberCount")
      .textContent =
        "Ładowanie subskrybentów...";


    openModal(
      "profileModal"
    );


    /*
      Najpierw szukamy kanału użytkownika.
    */

    const channelResult =
      await sb
        .from("channels")
        .select(
          "id"
        )
        .eq(
          "owner_id",
          currentUser.id
        )
        .limit(1);


    if (
      channelResult.error
    ) {

      $("subscriberCount")
        .textContent =
          "Nie udało się pobrać liczby subskrybentów";

      console.error(
        channelResult.error
      );

      return;

    }


    const channel =
      channelResult.data?.[0];


    if (!channel) {

      $("subscriberCount")
        .textContent =
          "0 subskrybentów";

      return;

    }


    /*
      Liczymy subskrypcje.
    */

    const countResult =
      await sb
        .from("subscriptions")
        .select(
          "channel_id",
          {
            count: "exact",
            head: true
          }
        )
        .eq(
          "channel_id",
          channel.id
        );


    if (
      countResult.error
    ) {

      console.error(
        "SUB COUNT ERROR:",
        countResult.error
      );


      $("subscriberCount")
        .textContent =
          "Nie udało się pobrać liczby subskrybentów";

      return;

    }


    const count =
      countResult.count || 0;


    $("subscriberCount")
      .textContent =
        count +
        (
          count === 1
            ? " subskrybent"
            : " subskrybentów"
        );

  }


  $("profileBtn").onclick =
    showMyProfile;


  $("account").addEventListener(
    "click",
    function(event) {

      if (
        event.target.closest(
          "#accountProfile"
        )
      ) {

        showMyProfile();

      }

    }
  );


  /* =========================
     START
  ========================= */

  init();

</script>
